<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>🛒 Súper</title>
  <style>
    :root {
      --accent: #00ff88;
      --accent-glow: rgba(0, 255, 136, 0.15);
      --bg: #000;
      --surface: #111;
      --surface-elevated: #1a1a1a;
      --text: #fff;
      --muted: #8e8e93;
      --border: #2c2c2e;
      --danger: #ff453a;
      --danger-surface: rgba(255, 69, 58, 0.12);
      --radius: 16px;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);

      /* Motor de cristal líquido de alta velocidad */
      --glass-fill: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 50%, rgba(17, 17, 17, 0.6) 100%);
      --glass-fill-elevated: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 50%, rgba(26, 26, 26, 0.65) 100%);
      --glass-rim: 1px solid rgba(255, 255, 255, 0.11);
      --glass-rim-active: 1px solid var(--accent);
      --glass-lens: inset 0 1px 0 0 rgba(255, 255, 255, 0.22), inset 0 -1px 0 0 rgba(255, 255, 255, 0.04);
      --glass-blur: blur(24px) saturate(190%);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, textarea {
      user-select: auto;
    }

    button, .product-card, .cart-item, .note-card, .item-toggle-wrap, .search-input, .unified-note-input {
      touch-action: manipulation;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
    }

    /* CONTENEDOR DE PANELES MÓVILES ACELERADO POR HARDWARE */
    .app-container {
      position: absolute;
      inset: 0;
      z-index: 1;
      contain: strict;
    }

    .panels-container {
      display: flex;
      width: 300vw;
      height: 100vh;
      height: 100dvh;
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translate3d(-100vw, 0, 0);
      contain: layout style;
    }

    .panels-container.is-swiping * {
      pointer-events: none !important;
    }

    .panel {
      width: 100vw;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 16px);
      contain: strict;
    }

    .panel-header {
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 32px;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    /* BÚSQUEDA Y BOTONES */
    .search-container {
      position: relative;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .search-input {
      width: 100%;
      padding: 13px 115px 13px 16px;
      background: var(--glass-fill);
      border: var(--glass-rim);
      border-radius: var(--radius);
      box-shadow: var(--glass-lens);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search-input::placeholder {
      color: var(--muted);
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 14px var(--accent-glow), var(--glass-lens);
    }

    .add-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 7px 12px;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.3px;
      white-space: nowrap;
      display: none;
      cursor: pointer;
      z-index: 2;
      box-shadow: 0 2px 10px var(--accent-glow);
      transition: transform 0.08s cubic-bezier(0, 0, 0.2, 1), opacity 0.15s ease;
    }

    .add-btn:active {
      transform: translateY(-50%) scale(0.94);
    }

    #add-note-btn {
      display: block;
    }

    /* SCROLL CONTAINER */
    .scroll-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      contain: content;
    }

    .scroll-area {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      overscroll-behavior-y: contain;
      padding: 6px 2px 30px;
      will-change: scroll-position;
      transform: translateZ(0);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0px, #000 12px, #000 calc(100% - 16px), transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0px, #000 12px, #000 calc(100% - 16px), transparent 100%);
    }

    .scroll-area::-webkit-scrollbar {
      display: none;
    }

    /* GRID EXPLORAR PRODUCTOS */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      gap: 8px;
    }

    .product-card {
      position: relative;
      background: var(--glass-fill);
      border: var(--glass-rim);
      border-radius: var(--radius);
      box-shadow: var(--glass-lens);
      padding: 14px 8px;
      text-align: center;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
      cursor: pointer;
      contain: layout style;
      content-visibility: auto;
      contain-intrinsic-size: 54px;
      transition: transform 0.08s cubic-bezier(0, 0, 0.2, 1), border-color 0.12s ease, color 0.12s ease, background 0.12s ease;
    }

    .product-card:active {
      transform: scale(0.95);
      background: rgba(0, 255, 136, 0.08);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* LISTA DEL CARRITO Y NOTAS */
    .cart-list, .notes-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cart-item {
      position: relative;
      background: var(--glass-fill);
      border: var(--glass-rim);
      border-radius: var(--radius);
      box-shadow: var(--glass-lens);
      padding: 11px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      contain: layout style;
      content-visibility: auto;
      contain-intrinsic-size: 48px;
      transition: opacity 0.16s ease, border-color 0.12s ease, background 0.12s ease;
    }

    .cart-item.completed {
      opacity: 0.5;
      background: rgba(17, 17, 17, 0.3);
      border-color: rgba(255, 255, 255, 0.05);
    }

    .cart-item.completed .item-name {
      text-decoration: line-through;
      color: var(--muted);
    }

    .item-toggle-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .item-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.12s ease, border-color 0.12s ease;
    }

    .cart-item.completed .item-checkbox {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .item-checkbox svg {
      display: none;
      width: 13px;
      height: 13px;
      stroke: #000;
      stroke-width: 3;
      fill: none;
    }

    .cart-item.completed .item-checkbox svg {
      display: block;
    }

    .item-name {
      font-size: 14.5px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      background: var(--glass-fill-elevated);
      border: var(--glass-rim);
      box-shadow: var(--glass-lens);
      color: var(--text);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.08s cubic-bezier(0, 0, 0.2, 1), border-color 0.12s ease, color 0.12s ease;
    }

    .qty-btn:active {
      transform: scale(0.9);
      border-color: var(--accent);
      color: var(--accent);
    }

    .cart-item.completed .qty-btn {
      display: none !important;
    }

    .item-qty-badge {
      font-size: 13px;
      font-weight: 600;
      min-width: 18px;
      text-align: center;
    }

    .cart-item.completed .item-qty-badge {
      font-size: 11.5px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 2px 7px;
      border-radius: 999px;
    }

    .cart-item.completed .item-qty-badge::before {
      content: '×';
    }

    .delete-btn {
      width: 28px;
      height: 28px;
      border: 1px solid rgba(255, 69, 58, 0.25);
      background: var(--danger-surface);
      color: var(--danger);
      border-radius: 8px;
      font-size: 18px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.08s cubic-bezier(0, 0, 0.2, 1);
    }

    .cart-item.completed .delete-btn {
      display: flex;
    }

    .delete-btn:active {
      transform: scale(0.9);
    }

    /* FOOTER DE LISTA */
    .list-footer {
      padding-top: 8px;
      display: none;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .clear-all {
      color: var(--danger);
      background: var(--danger-surface);
      border: 1px solid rgba(255, 69, 58, 0.25);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.08s cubic-bezier(0, 0, 0.2, 1), opacity 0.15s ease;
    }

    .clear-all:active {
      transform: scale(0.94);
    }

    /* NOTAS */
    .note-card {
      position: relative;
      background: var(--glass-fill-elevated);
      border: var(--glass-rim);
      border-radius: var(--radius);
      box-shadow: var(--glass-lens);
      padding: 14px;
      cursor: pointer;
      contain: layout style;
      content-visibility: auto;
      contain-intrinsic-size: 72px;
      transition: transform 0.08s cubic-bezier(0, 0, 0.2, 1), border-color 0.12s ease, background 0.12s ease;
    }

    .note-card:active {
      transform: scale(0.98);
      background: rgba(0, 255, 136, 0.06);
      border-color: var(--accent);
    }

    .note-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
      padding-right: 32px;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .note-body {
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .note-date {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 8px;
      text-align: right;
    }

    .delete-note {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--danger-surface);
      color: var(--danger);
      border: 1px solid rgba(255, 69, 58, 0.25);
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      z-index: 2;
      transition: transform 0.08s cubic-bezier(0, 0, 0.2, 1);
    }

    .delete-note:active {
      transform: scale(0.88);
    }

    /* ESTADOS VACÍOS */
    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 50px 20px;
      grid-column: 1 / -1;
    }

    .empty-state-icon {
      font-size: 42px;
      margin-bottom: 10px;
      opacity: 0.5;
    }

    .empty-state-text {
      font-size: 13.5px;
      line-height: 1.5;
    }

    /* MODAL DE NOTAS */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.58);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
      padding: 20px;
    }

    .modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--glass-fill-elevated);
      border: var(--glass-rim);
      border-radius: calc(var(--radius) + 2px);
      box-shadow: var(--glass-lens), 0 20px 40px rgba(0, 0, 0, 0.8);
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      max-height: 85dvh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      transform: translate3d(0, 14px, 0) scale(0.98);
      will-change: transform;
      transition: transform 0.22s cubic-bezier(0.18, 0.9, 0.25, 1);
    }

    .modal.active .modal-content {
      transform: translate3d(0, 0, 0) scale(1);
    }

    .note-form {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .unified-note-input {
      width: 100%;
      min-height: 110px;
      max-height: 50vh;
      max-height: 50dvh;
      padding: 13px;
      margin-bottom: 12px;
      background: rgba(0, 0, 0, 0.45);
      border: var(--glass-rim);
      border-radius: var(--radius);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
      color: var(--text);
      font: inherit;
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      overflow-y: auto;
      outline: none;
      overscroll-behavior: contain;
      field-sizing: content;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .unified-note-input::placeholder {
      color: var(--muted);
    }

    .unified-note-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow), inset 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      padding: 9px 16px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.08s cubic-bezier(0, 0, 0.2, 1), opacity 0.15s ease;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-cancel {
      background: var(--glass-fill);
      color: var(--muted);
      border: var(--glass-rim);
    }

    .btn-save {
      background: var(--accent);
      color: #000;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 20px);
      left: 50%;
      transform: translate3d(-50%, 16px, 0);
      background: var(--glass-fill-elevated);
      border: 1px solid rgba(0, 255, 136, 0.3);
      color: var(--accent);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      will-change: transform, opacity;
      transition: transform 0.18s cubic-bezier(0.18, 0.9, 0.25, 1), opacity 0.18s ease;
      z-index: 1200;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), 0 0 12px var(--accent-glow);
    }

    .toast.show {
      transform: translate3d(-50%, 0, 0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="app-container" id="app-container">
    <div class="panels-container" id="panels-container">
      
      <!-- PANEL 0: EXPLORAR -->
      <div class="panel">
        <div class="panel-header">
          <h1 class="panel-title">Explorar</h1>
        </div>
        <div class="search-container">
          <input type="text" class="search-input" id="search" placeholder="Buscar..." autocomplete="off">
          <button type="button" class="add-btn" id="add-btn">AÑADIR</button>
        </div>
        <div class="scroll-container">
          <div class="scroll-area">
            <div class="grid" id="products-grid"></div>
            <div class="empty-state" id="products-empty" style="display: none;">
              <div class="empty-state-icon">🔍</div>
              <p class="empty-state-text">No se encontraron productos.<br>Pulsa <strong>Añadir</strong> para agregarlo.</p>
            </div>
          </div>
        </div>
      </div>

      <!-- PANEL 1: LISTA -->
      <div class="panel">
        <div class="panel-header">
          <h1 class="panel-title">Lista</h1>
        </div>
        <div class="scroll-container">
          <div class="scroll-area">
            <div class="cart-list" id="cart-list"></div>
          </div>
        </div>
        <div class="list-footer" id="list-footer">
          <button type="button" class="clear-all" id="clear-all">Vaciar</button>
        </div>
      </div>

      <!-- PANEL 2: NOTAS -->
      <div class="panel">
        <div class="panel-header">
          <h1 class="panel-title">Notas</h1>
        </div>
        <div class="search-container">
          <input type="text" class="search-input" id="search-notes" placeholder="Buscar notas..." autocomplete="off">
          <button type="button" class="add-btn" id="add-note-btn">NUEVA NOTA</button>
        </div>
        <div class="scroll-container">
          <div class="scroll-area">
            <div class="notes-grid" id="notes-grid"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL NOTA -->
    <div class="modal" id="note-modal" role="dialog" aria-modal="true">
      <div class="modal-content">
        <form class="note-form" id="note-form">
          <textarea id="note-text" class="unified-note-input" placeholder="Escribe tu nota aquí..." rows="3" required></textarea>
          <div class="modal-actions">
            <button type="button" class="btn btn-cancel" id="cancel-note">Cancelar</button>
            <button type="submit" class="btn btn-save">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Añadido a la lista</div>

    const ADAPTIVE_EASING = 'cubic-bezier(0.18, 0.9, 0.25, 1)';

    const normalize = str => (str || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();

    const generateId = () => {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
      return Date.now().toString(36) + Math.random().toString(36).substring(2, 8);

    /* ALMACENAMIENTO ASÍNCRONO NO BLOQUEANTE (CERO PÉRDIDA DE DATOS) */
    const store = {
      _queue: new Map(),
      _scheduled: false,

      get: (k, fallback = []) => {
        try {
          const raw = localStorage.getItem(k);
          if (!raw) return fallback;
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : fallback;
        } catch (e) {
          console.error(`Error leyendo ${k}:`, e);
          return fallback;
        }
      },

      set: function(k, v) {
        this._queue.set(k, v);
        if (!this._scheduled) {
          this._scheduled = true;
          // Escribe fuera del fotograma crítico de renderizado
          queueMicrotask(() => this.flush());
        }
        return true;
      },

      flush: function() {
        this._scheduled = false;
        this._queue.forEach((val, key) => {
          try {
            localStorage.setItem(key, JSON.stringify(val));
          } catch (e) {
            console.error(`Error guardando ${key}:`, e);
            showToast('Aviso: Espacio de almacenamiento lleno');
          }
        });
        this._queue.clear();
      }
    };

    window.addEventListener('beforeunload', () => store.flush());
    window.addEventListener('pagehide', () => store.flush());
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') store.flush();
    });

    /* RECUPERACIÓN AUTOMÁTICA DE DATOS ANTERIORES */
    function recoverLegacyStorage() {
      if (!localStorage.getItem(KEYS.PRODUCTS)) {
        for (const oldKey of LEGACY_KEYS.PRODUCTS) {
          const legacy = store.get(oldKey, null);
          if (legacy && legacy.length > 0) {
            store.set(KEYS.PRODUCTS, legacy);
            break;
          }
        }
      }

      if (!localStorage.getItem(KEYS.CART)) {
        for (const oldKey of LEGACY_KEYS.CART) {
          const legacy = store.get(oldKey, null);
          if (legacy && legacy.length > 0) {
            store.set(KEYS.CART, legacy);
            break;
          }
        }
      }

      if (!localStorage.getItem(KEYS.NOTES)) {
        for (const oldKey of LEGACY_KEYS.NOTES) {
          const legacy = store.get(oldKey, null);
          if (legacy && legacy.length > 0) {
            store.set(KEYS.NOTES, legacy);
            break;
          }
        }
      }
      store.flush();
    }

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',

      "'": '&#39;'

    function syncProducts() {
      const stored = store.get(KEYS.PRODUCTS, []);
      if (!stored.length) {
        products = defaultProducts.map(name => ({ name, norm: normalize(name) }));
        store.set(KEYS.PRODUCTS, products.map(p => ({ name: p.name })));
      } else {
        products = stored.map(p => {
          const name = typeof p === 'string' ? p : (p.name || '');
          return { name, norm: normalize(name) };
        }).filter(p => p.name);
      }
      rebuildProductsDOM();
    }

    function syncCart() {
      const storedCart = store.get(KEYS.CART, []);
      cartItems = storedCart.map(i => ({
        id: i.id || generateId(),
        name: String(i.name || ''),
        qty: Math.max(1, parseInt(i.qty, 10) || 1),
        completed: Boolean(i.completed)
      }));
    }

    function syncNotes() {
      const storedNotes = store.get(KEYS.NOTES, []);
      notes = storedNotes.map(n => {
        const text = String(n.text ?? [n.title, n.content].filter(Boolean).join('\n') ?? '');
        const validDate = parseValidDate(n.date);
        return {
          id: String(n.id || generateId()),
          text,
          norm: normalize(text),
          date: validDate.toISOString(),
          formattedDate: dateFormatter.format(validDate)
        };
      });
    }

    function initApp() {
      recoverLegacyStorage();
      syncProducts();

      renderCart();

    function setContainerPosition(offsetPx, durationMs = 0, easing = ADAPTIVE_EASING) {
      currentContainerX = offsetPx;
      if (durationMs > 0) {
        isTransitioning = true;
        panelsContainer.style.transition = `transform ${durationMs}ms ${easing}`;
      } else {
        isTransitioning = false;
        panelsContainer.style.transition = 'none';
      }
      panelsContainer.style.transform = `translate3d(${offsetPx}px, 0, 0)`;
    }

    panelsContainer.addEventListener('transitionend', e => {
      if (e.target === panelsContainer && e.propertyName === 'transform') {
        isTransitioning = false;
        panelsContainer.style.transition = 'none';
      }
    });

    function snapToPanel(index, duration = 340, easing = ADAPTIVE_EASING) {
      currentPanel = Math.max(0, Math.min(2, index));
      setContainerPosition(-currentPanel * window.innerWidth, duration, easing);
    }

    /* MOTOR TÁCTIL DE LATENCIA CERO (REACCIÓN INMEDIATA) */
    function setupTouchSwipe() {
      let startX = 0, startY = 0, currentX = 0;
      let isDragging = false;
      let isHorizontal = null;
      let dragBaseOffset = 0;
      let velocitySamples = [];
      let lastWidth = window.innerWidth;
      let didSwipe = false;
      let preventNextClick = false;

      // Intercepta solo el falso clic generado por el propio arrastre
      document.addEventListener('click', e => {
        if (preventNextClick) {
          preventNextClick = false;
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);

      document.addEventListener('touchstart', e => {
        if (noteModal.classList.contains('active') || e.touches.length > 1) return;
        if (e.target.closest('input, textarea, .qty-btn, .delete-btn, .delete-note, button')) return;

        const t = e.touches[0];
        startX = currentX = t.clientX;
        startY = t.clientY;
        isDragging = true;
        isHorizontal = null;
        didSwipe = false;

        const now = performance.now();
        velocitySamples = [{ x: startX, t: now }];

        // Detener animación en vuelo sin relayout forzado
        if (isTransitioning) {
          isTransitioning = false;
          panelsContainer.style.transition = 'none';
        }
        dragBaseOffset = currentContainerX;
      }, { passive: true });

      document.addEventListener('touchmove', e => {
        if (!isDragging || e.touches.length > 1) return;

        const t = e.touches[0];
        const dx = t.clientX - startX;
        const dy = t.clientY - startY;

        if (isHorizontal === null) {
          const absX = Math.abs(dx);
          const absY = Math.abs(dy);
          if (absX > 9 || absY > 9) {
            isHorizontal = absX > absY * 1.35;
            if (isHorizontal) {
              panelsContainer.classList.add('is-swiping');
              didSwipe = true;
            } else {
              isDragging = false;
              return;
            }
          }
        }

        if (!isHorizontal) return;
        currentX = t.clientX;

        const now = performance.now();
        velocitySamples.push({ x: currentX, t: now });
        while (velocitySamples.length > 1 && now - velocitySamples[0].t > 70) {
          velocitySamples.shift();
        }

        const w = window.innerWidth;
        let targetX = dragBaseOffset + dx;

        // Resistencia amortiguada en extremos
        if (targetX > 0) {
          targetX = Math.pow(targetX, 0.82) * 2.8;
        } else if (targetX < -2 * w) {
          const over = targetX - (-2 * w);
          targetX = -2 * w - Math.pow(Math.abs(over), 0.82) * 2.8;
        }

        // Vínculo directo con GPU sin retrasos de marco
        currentContainerX = targetX;
        panelsContainer.style.transform = `translate3d(${targetX}px, 0, 0)`;
      }, { passive: true });

      const onDragEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        panelsContainer.classList.remove('is-swiping');

        if (isHorizontal) {
          const w = window.innerWidth;
          let velocity = 0;

          if (velocitySamples.length >= 2) {
            const first = velocitySamples[0];
            const last = velocitySamples[velocitySamples.length - 1];
            const dt = Math.max(1, last.t - first.t);
            velocity = (last.x - first.x) / dt;
          }

          const dx = currentX - startX;
          const absV = Math.abs(velocity);
          const isFlick = absV > 0.24;

          if (isFlick) {
            if (velocity < -0.24 && currentPanel < 2) currentPanel++;
            else if (velocity > 0.24 && currentPanel > 0) currentPanel--;
          } else {
            if (dx < -w * 0.25 && currentPanel < 2) currentPanel++;
            else if (dx > w * 0.25 && currentPanel > 0) currentPanel--;
          }

          const targetX = -currentPanel * w;
          const remainingDistance = Math.abs(targetX - currentContainerX);

          let duration;
          if (isFlick) {
            duration = Math.round(remainingDistance / (absV * 1.15));
            duration = Math.max(260, Math.min(380, duration));
          } else {
            const ratio = Math.min(1, remainingDistance / w);
            duration = Math.round(300 + ratio * 80);
          }

          preventNextClick = true;
          setContainerPosition(targetX, duration, ADAPTIVE_EASING);
        }
      };

      document.addEventListener('touchend', onDragEnd, { passive: true });
      document.addEventListener('touchcancel', onDragEnd, { passive: true });

      window.addEventListener('resize', () => {
        const w = window.innerWidth;
        if (w !== lastWidth) {
          lastWidth = w;
          snapToPanel(currentPanel, 0);
        }
      }, { passive: true });
    }

    /* EXPLORAR PRODUCTOS CON RECICLAJE DE NODOS A 280 FPS */
    function rebuildProductsDOM() {
      productsGrid.innerHTML = '';
      const frag = document.createDocumentFragment();
      productElements = products.map(p => {
        const el = document.createElement('div');
        el.className = 'product-card';
        el.textContent = p.name;
        el.dataset.name = p.name;
        frag.appendChild(el);
        return { name: p.name, norm: p.norm, el, hidden: false };
      });
      productsGrid.appendChild(frag);
    }

    function renderProducts(query = "") {
      const q = normalize(query);
      let count = 0;
      let exactMatch = false;

      for (let i = 0, l = productElements.length; i < l; i++) {
        const item = productElements[i];
        if (item.norm === q) exactMatch = true;
        const match = !q || item.norm.includes(q);
        if (match) {
          if (item.hidden) {
            item.el.style.display = '';
            item.hidden = false;
          }
          count++;
        } else {
          if (!item.hidden) {
            item.el.style.display = 'none';
            item.hidden = true;
          }
        }
      }

      productsEmpty.style.display = count ? 'none' : 'block';
      addBtn.style.display = (q && !exactMatch) ? 'block' : 'none';
    }

    productsGrid.addEventListener('click', e => {
      const card = e.target.closest('.product-card');
      if (!card) return;
      addToCart(card.dataset.name);
    });

    function addToCart(name) {
      const trimmed = (name || '').trim();
      if (!trimmed) return;

      const norm = normalize(trimmed);
      const existing = cartItems.find(i => normalize(i.name) === norm);
      if (existing) {
        existing.qty++;
        existing.completed = false;
      } else {
        cartItems.push({ id: generateId(), name: trimmed, qty: 1, completed: false });
      }
      store.set(KEYS.CART, cartItems);
      renderCart();
      showToast(`Añadido: ${trimmed}`);
    }

    // Ejecución instantánea en el mismo fotograma
    searchInput.addEventListener('input', e => {
      renderProducts(e.target.value);
    });

    function addProductToCatalog(rawName) {
      const norm = normalize(rawName);
      let existing = productElements.find(p => p.norm === norm);
      if (!existing) {
        const el = document.createElement('div');
        el.className = 'product-card';
        el.textContent = rawName;
        el.dataset.name = rawName;

        let inserted = false;
        for (let i = 0; i < productElements.length; i++) {
          if (productElements[i].name.localeCompare(rawName, 'es', { sensitivity: 'base' }) > 0) {
            productsGrid.insertBefore(el, productElements[i].el);
            productElements.splice(i, 0, { name: rawName, norm, el, hidden: false });
            products.splice(i, 0, { name: rawName, norm });
            inserted = true;
            break;
          }
        }
        if (!inserted) {
          productsGrid.appendChild(el);
          productElements.push({ name: rawName, norm, el, hidden: false });
          products.push({ name: rawName, norm });
        }
        store.set(KEYS.PRODUCTS, products.map(p => ({ name: p.name })));
        return rawName;
      }
      return existing.name;
    }

    function handleAddProductFromInput() {
      const rawName = searchInput.value.trim();
      if (!rawName) return;
      const canonicalName = addProductToCatalog(rawName);
      addToCart(canonicalName);
      searchInput.value = '';
      addBtn.style.display = 'none';
      renderProducts();
    }

    addBtn.addEventListener('click', handleAddProductFromInput);
    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleAddProductFromInput();
      }
    });

    /* LISTA DEL CARRITO RECONCILIADA (SIN DESTRUCCIÓN DE NODOS) */
    const cartElementsMap = new Map();

    function createCartItemElement(item) {
      const el = document.createElement('div');
      el.className = 'cart-item' + (item.completed ? ' completed' : '');
      el.dataset.id = item.id;
      el.innerHTML = `
        <div class="item-toggle-wrap">
          <div class="item-checkbox">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
          <span class="item-name">${esc(item.name)}</span>
        </div>
        <div class="cart-controls">
          <button type="button" class="qty-btn" data-action="dec" aria-label="Menos">-</button>
          <span class="item-qty-badge">${item.qty}</span>
          <button type="button" class="qty-btn" data-action="inc" aria-label="Más">+</button>
          <button type="button" class="delete-btn" data-action="del" aria-label="Eliminar">×</button>
        </div>`;
      return el;
    }

    function renderCart() {
      if (!cartItems.length) {
        cartList.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🛒</div>
            <p class="empty-state-text">Tu lista está vacía.<br>Añade productos desde <strong>Explorar</strong>.</p>
          </div>`;
        listFooter.style.display = 'none';
        cartElementsMap.clear();
        return;
      }

      listFooter.style.display = 'flex';

      const sorted = [...cartItems].sort((a, b) => {
        if (a.completed === b.completed) return a.name.localeCompare(b.name, 'es', { sensitivity: 'base' });
        return a.completed ? 1 : -1;
      });

      const currentIds = new Set(sorted.map(i => i.id));
      cartElementsMap.forEach((el, id) => {
        if (!currentIds.has(id)) {
          el.remove();
          cartElementsMap.delete(id);
        }
      });

      const emptyEl = cartList.querySelector('.empty-state');
      if (emptyEl) emptyEl.remove();

      const frag = document.createDocumentFragment();
      for (let i = 0; i < sorted.length; i++) {
        const item = sorted[i];
        let el = cartElementsMap.get(item.id);
        if (!el) {
          el = createCartItemElement(item);
          cartElementsMap.set(item.id, el);
        } else {
          el.classList.toggle('completed', item.completed);
          const qtyBadge = el.querySelector('.item-qty-badge');
          if (qtyBadge && qtyBadge.textContent !== String(item.qty)) {
            qtyBadge.textContent = item.qty;
          }
        }
        frag.appendChild(el);
      }
      cartList.appendChild(frag);
    }

    cartList.addEventListener('click', e => {
      const itemEl = e.target.closest('.cart-item');
      if (!itemEl) return;
      const id = itemEl.dataset.id;

      const item = cartItems.find(i => String(i.id) === id);
      if (!item) return;

      const actionBtn = e.target.closest('button');
      if (actionBtn) {
        const action = actionBtn.dataset.action;
        if (action === 'inc') {
          if (item.completed) return;
          item.qty++;
          const qtyBadge = itemEl.querySelector('.item-qty-badge');
          if (qtyBadge) qtyBadge.textContent = item.qty;
          store.set(KEYS.CART, cartItems);
        } else if (action === 'dec') {
          if (item.completed) return;
          if (item.qty > 1) {
            item.qty--;
            const qtyBadge = itemEl.querySelector('.item-qty-badge');
            if (qtyBadge) qtyBadge.textContent = item.qty;
            store.set(KEYS.CART, cartItems);
          } else {
            cartItems = cartItems.filter(i => String(i.id) !== id);
            itemEl.remove();
            cartElementsMap.delete(id);
            store.set(KEYS.CART, cartItems);
            if (!cartItems.length) renderCart();
          }
        } else if (action === 'del') {
          cartItems = cartItems.filter(i => String(i.id) !== id);
          itemEl.remove();
          cartElementsMap.delete(id);
          store.set(KEYS.CART, cartItems);
          if (!cartItems.length) renderCart();
        }
      } else {
        item.completed = !item.completed;
        store.set(KEYS.CART, cartItems);
        renderCart();
      }
    });

    $('clear-all').addEventListener('click', () => {
      if (cartItems.length && confirm('¿Vaciar toda la lista?')) {
        cartItems = [];
        store.set(KEYS.CART, cartItems);
        renderCart();
      }
    });

    /* NOTAS OPTIMIZADAS */
    const noteElementsMap = new Map();

    function parseNoteParts(rawText) {
      const lines = (rawText || '').trim().split('\n');
      const title = lines[0] || 'Nota';
      const body = lines.slice(1).join('\n').trim();
      return { title, body };
    }

    function createNoteElement(note) {
      const el = document.createElement('div');
      el.className = 'note-card';
      el.dataset.id = note.id;
      const { title, body } = parseNoteParts(note.text);
      el.innerHTML = `
        <button type="button" class="delete-note" data-delete-id="${esc(note.id)}" aria-label="Eliminar">×</button>
        <div class="note-title">${esc(title)}</div>
        ${body ? `<div class="note-body">${esc(body)}</div>` : ''}
        <div class="note-date">${note.formattedDate}</div>`;
      return el;
    }

    function renderNotes(query = "") {
      const q = normalize(query);
      const filtered = [];

      for (let i = 0, l = notes.length; i < l; i++) {
        const note = notes[i];
        if (!q || note.norm.includes(q)) {
          filtered.push(note);
        }
      }

      if (!filtered.length) {
        notesGrid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📝</div>
            <p class="empty-state-text">${q ? 'No se encontraron notas.' : 'No hay notas.<br>¡Crea tu primera nota!'}</p>
          </div>`;
        noteElementsMap.clear();
        return;
      }

      const emptyEl = notesGrid.querySelector('.empty-state');
      if (emptyEl) emptyEl.remove();

      const currentIds = new Set(filtered.map(n => n.id));
      noteElementsMap.forEach((el, id) => {
        if (!currentIds.has(id)) {
          el.remove();
          noteElementsMap.delete(id);
        }
      });

      const frag = document.createDocumentFragment();
      for (let i = 0; i < filtered.length; i++) {
        const note = filtered[i];
        let el = noteElementsMap.get(note.id);
        if (!el) {
          el = createNoteElement(note);
          noteElementsMap.set(note.id, el);
        }
        frag.appendChild(el);
      }
      notesGrid.appendChild(frag);
    }

    notesGrid.addEventListener('click', e => {
      const delBtn = e.target.closest('.delete-note');
      if (delBtn) {
        e.stopPropagation();
        const id = delBtn.dataset.deleteId;
        if (confirm('¿Eliminar esta nota?')) {
          notes = notes.filter(n => n.id !== id);
          const el = noteElementsMap.get(id);
          if (el) {
            el.remove();
            noteElementsMap.delete(id);
          }
          store.set(KEYS.NOTES, notes.map(n => ({ id: n.id, text: n.text, date: n.date })));
          renderNotes(searchNotesInput.value);
        }
        return;
      }

      const card = e.target.closest('.note-card');
      if (card) {
        const note = notes.find(n => n.id === card.dataset.id);
        if (note) openNoteModal(note);
      }
    });

    function openNoteModal(note = null) {
      currentNote = note;
      noteTextInput.value = note ? note.text : '';
      noteModal.classList.add('active');
      requestAnimationFrame(() => {
        autoResizeTextarea();
        noteTextInput.scrollTop = 0;
        noteTextInput.focus({ preventScroll: true });
      });
    }

    function closeNoteModal() {
      noteModal.classList.remove('active');
      noteTextInput.blur();
      currentNote = null;
      const modalContent = noteModal.querySelector('.modal-content');
      if (modalContent) modalContent.style.maxHeight = '';
    }

    function setupModalKeyboardSync() {
      if (!window.visualViewport) return;
      const modalContent = noteModal.querySelector('.modal-content');

      const onViewportChange = () => {
        if (!noteModal.classList.contains('active')) return;
        requestAnimationFrame(() => {
          const vv = window.visualViewport;
          modalContent.style.maxHeight = `${Math.min(vv.height - 32, window.innerHeight * 0.85)}px`;
        });
      };

      window.visualViewport.addEventListener('resize', onViewportChange, { passive: true });
      window.visualViewport.addEventListener('scroll', onViewportChange, { passive: true });
    }

    searchNotesInput.addEventListener('input', e => {
      const val = e.target.value;
      renderNotes(val);
      addNoteBtn.style.display = val.trim() ? 'none' : 'block';
    });

    addNoteBtn.addEventListener('click', () => openNoteModal());
    $('cancel-note').addEventListener('click', closeNoteModal);
    noteModal.addEventListener('click', e => { if (e.target === noteModal) closeNoteModal(); });

    $('note-form').addEventListener('submit', e => {
      e.preventDefault();
      const text = noteTextInput.value.trim();
      if (!text) return;

      const date = new Date().toISOString();
      const formattedDate = dateFormatter.format(new Date(date));
      const norm = normalize(text);

      if (currentNote) {
        const idx = notes.findIndex(n => n.id === currentNote.id);
        const updated = {
          id: currentNote.id,
          text,
          norm,
          date,
          formattedDate
        };
        if (idx !== -1) {
          notes[idx] = updated;
        } else {
          notes.unshift(updated);
        }
        const oldEl = noteElementsMap.get(currentNote.id);
        if (oldEl) {
          oldEl.remove();
          noteElementsMap.delete(currentNote.id);
        }
      } else {
        notes.unshift({
          id: generateId(),
          text,
          norm,
          date,
          formattedDate
        });
      }

      store.set(KEYS.NOTES, notes.map(n => ({ id: n.id, text: n.text, date: n.date })));
      renderNotes(searchNotesInput.value);
      closeNoteModal();
    });
  </script>
</body>
</html>
