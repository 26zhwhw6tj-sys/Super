<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- user-scalable=no removed: it blocks pinch-zoom (WCAG 1.4.4). Zoom-on-focus on iOS is avoided with 16px inputs. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Súper – Lista de la compra y notas</title>
  <meta name="description" content="Súper: lista de la compra y notas rápidas que funcionan sin conexión y se guardan en tu dispositivo.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Súper">
  <!-- Inline favicon: avoids a /favicon.ico 404 and an extra request -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛒%3C/text%3E%3C/svg%3E">

  <!-- Critical CSS: the whole UI is an app shell, so it stays inline (zero render-blocking requests) -->
  <style>
    :root {
      --accent: #00ff88;
      --accent-glow: rgba(0, 255, 136, 0.15);
      --bg: #000;
      --surface-elevated: #1a1a1a;
      --text: #fff;
      --muted: #8e8e93;
      --danger: #ff453a;
      --danger-surface: rgba(255, 69, 58, 0.12);
      --radius: 16px;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);

      /* ===== Liquid Glass: clear (not dark-tinted) glass with real light on its edges ===== */
      --glass-fill: linear-gradient(135deg, rgba(255, 255, 255, 0.075) 0%, rgba(255, 255, 255, 0.022) 38%, rgba(255, 255, 255, 0.012) 62%, rgba(255, 255, 255, 0.05) 100%);
      --glass-fill-elevated: linear-gradient(135deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.028) 38%, rgba(255, 255, 255, 0.015) 62%, rgba(255, 255, 255, 0.06) 100%);
      --glass-rim: 1px solid rgba(255, 255, 255, 0.10);
      /* Thin outline, specular light (top-left), bounce light (bottom-right), edge caustics, inner volume */
      --glass-lens:
        inset 0 0 0 1px rgba(255, 255, 255, 0.07),
        inset 2px 2px 1.5px -1px rgba(255, 255, 255, 0.80),
        inset -2px -2px 1.5px -1px rgba(255, 255, 255, 0.42),
        inset 0 10px 14px -10px rgba(255, 255, 255, 0.22),
        inset 0 -10px 14px -10px rgba(255, 255, 255, 0.12),
        inset 0 0 24px rgba(255, 255, 255, 0.045);
      /* Fallback for browsers without SVG backdrop refraction (Safari/Firefox): very little blur = very translucent */
      --glass-blur: blur(6px) saturate(180%) brightness(1.12);
      /* Springy "liquid" response when releasing a press */
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    [hidden] { display: none !important; }

    /* Inherited properties: set once on body instead of on every element via "*" */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    input, textarea {
      user-select: text;
      -webkit-user-select: text;
    }

    button, input, textarea {
      font-family: inherit;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
      touch-action: pan-y pinch-zoom;
    }

    /* Visually hidden but available to assistive technology */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /* Contenedor de iluminación ambiental con máscara perimetral suave:
       Garantiza un margen negro imperceptible en los 4 bordes para que ningún foco
       pueda iluminar jamás el límite de la pantalla. */
    .ambient {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      contain: strict;
      -webkit-mask-image:
        linear-gradient(to right, transparent 0%, rgba(0, 0, 0, 0.18) 6%, rgba(0, 0, 0, 0.72) 13%, #000 20%, #000 80%, rgba(0, 0, 0, 0.72) 87%, rgba(0, 0, 0, 0.18) 94%, transparent 100%),
        linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.18) 5%, rgba(0, 0, 0, 0.72) 11%, #000 17%, #000 83%, rgba(0, 0, 0, 0.72) 89%, rgba(0, 0, 0, 0.18) 95%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-image:
        linear-gradient(to right, transparent 0%, rgba(0, 0, 0, 0.18) 6%, rgba(0, 0, 0, 0.72) 13%, #000 20%, #000 80%, rgba(0, 0, 0, 0.72) 87%, rgba(0, 0, 0, 0.18) 94%, transparent 100%),
        linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.18) 5%, rgba(0, 0, 0, 0.72) 11%, #000 17%, #000 83%, rgba(0, 0, 0, 0.72) 89%, rgba(0, 0, 0, 0.18) 95%, transparent 100%);
      mask-composite: intersect;
    }

    /* Cada foco verde tiene una caída Gaussiana de 6 paradas que se funde con el negro
       antes de llegar al límite de su propio contenedor. */
    .ambient-orb {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--orb-size, 240px);
      height: var(--orb-size, 240px);
      border-radius: 50%;
      pointer-events: none;
      will-change: transform, opacity;
      opacity: 0;
      background: radial-gradient(
        circle at 50% 50%,
        rgba(var(--orb-rgb, 0, 255, 136), 0.18) 0%,
        rgba(var(--orb-rgb, 0, 255, 136), 0.115) 24%,
        rgba(var(--orb-rgb, 0, 255, 136), 0.052) 48%,
        rgba(var(--orb-rgb, 0, 255, 136), 0.015) 70%,
        rgba(var(--orb-rgb, 0, 255, 136), 0.002) 86%,
        transparent 100%
      );
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Elements with "contain: paint" would clip an outside outline, so draw it inside */
    .product-card:focus-visible,
    .note-open:focus-visible {
      outline-offset: -4px;
      border-radius: var(--radius);
    }

    /* Keyboard / screen-reader panel switcher: only visible while focused */
    .panel-nav {
      position: fixed;
      top: calc(var(--safe-top) + 4px);
      left: 50%;
      z-index: 1100;
      display: flex;
      gap: 6px;
      padding: 6px;
      background: var(--surface-elevated);
      border: var(--glass-rim);
      border-radius: 999px;
      transform: translate(-50%, -300%);
      transition: transform 0.2s ease;
    }

    .panel-nav:focus-within {
      transform: translate(-50%, 0);
    }

    .panel-nav button[aria-current="true"] {
      background: var(--accent);
      color: #000;
    }

    .app-container {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
    }

    .panels-container {
      display: flex;
      width: 300vw;
      height: 100vh;
      height: 100dvh;
      will-change: transform;
      backface-visibility: hidden;
      transform: translate3d(-100vw, 0, 0);
    }

    .panel {
      width: 100vw;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 16px);
      contain: layout style paint;
    }

    .panel-header {
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 32px;
    }

    .panel-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .search-container {
      position: relative;
      margin-bottom: 14px;
    }

    .search-input {
      width: 100%;
      padding: 13px 115px 13px 16px;
      background: var(--glass-fill);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: var(--glass-rim);
      border-radius: var(--radius);
      box-shadow: var(--glass-lens);
      color: var(--text);
      font-size: 16px; /* >=16px prevents iOS auto-zoom on focus */
      -webkit-appearance: none;
      appearance: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input::-webkit-search-cancel-button,
    .search-input::-webkit-search-decoration {
      -webkit-appearance: none;
      display: none;
    }

    .search-input::placeholder {
      color: var(--muted);
    }

    /* Focus is signalled by the accent border + glow */
    .search-input:focus-visible,
    .unified-note-input:focus-visible {
      outline: none;
    }

    /* On focus the glass "lights up" from the inside */
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 14px var(--accent-glow), inset 0 0 18px rgba(0, 255, 136, 0.08), var(--glass-lens);
    }

    .add-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 7px 12px;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.3px;
      white-space: nowrap;
      cursor: pointer;
      z-index: 2;
      touch-action: manipulation;
      box-shadow: 0 2px 10px var(--accent-glow);
      transition: transform 0.4s var(--spring);
    }

    .add-btn:active {
      transform: translateY(-50%) scale(0.95);
      transition-duration: 0.12s;
    }

    .scroll-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      contain: strict;
    }

    .scroll-area {
      height: 100%;
      overflow-y: auto;
      scrollbar-width: none;
      touch-action: pan-y pinch-zoom;
      overscroll-behavior-y: contain;
      padding: 6px 2px 30px;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0px, #000 12px, #000 calc(100% - 16px), transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0px, #000 12px, #000 calc(100% - 16px), transparent 100%);
    }

    .scroll-area::-webkit-scrollbar {
      display: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      gap: 8px;
    }

    .product-card {
      position: relative;
      width: 100%;
      background: var(--glass-fill);
      border: var(--glass-rim);
      border-radius: var(--radius);
      box-shadow: var(--glass-lens);
      padding: 14px 8px;
      text-align: center;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-wrap: anywhere;
      cursor: pointer;
      touch-action: manipulation;
      contain: layout style paint;
      content-visibility: auto;
      contain-intrinsic-size: auto 54px;
      transition: transform 0.4s var(--spring), border-color 0.12s ease, color 0.12s ease;
    }

    .product-card:active {
      transform: scale(0.96);
      background: rgba(0, 255, 136, 0.08);
      border-color: var(--accent);
      color: var(--accent);
      transition-duration: 0.12s;
    }

    .cart-list, .notes-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      list-style: none;
    }

    .cart-item {
      position: relative;
      background: var(--glass-fill);
      border: var(--glass-rim);
      border-radius: var(--radius);
      box-shadow: var(--glass-lens);
      padding: 11px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      touch-action: manipulation;
      contain: layout style paint;
      content-visibility: auto;
      contain-intrinsic-size: auto 50px;
      transition: opacity 0.18s ease, border-color 0.15s ease;
    }

    .cart-item.completed {
      opacity: 0.72;
      background: rgba(0, 0, 0, 0.25);
      border-color: rgba(255, 255, 255, 0.05);
    }

    .cart-item.completed .item-name {
      text-decoration: line-through;
      color: var(--muted);
    }

    .item-toggle-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      background: none;
      border: 0;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      touch-action: manipulation;
    }

    .item-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .cart-item.completed .item-checkbox {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .item-checkbox svg {
      display: none;
      width: 13px;
      height: 13px;
      stroke: #000;
      stroke-width: 3;
      fill: none;
    }

    .cart-item.completed .item-checkbox svg {
      display: block;
    }

    .item-name {
      font-size: 14.5px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .qty-btn {
      position: relative;
      width: 28px;
      height: 28px;
      background: var(--glass-fill-elevated);
      border: var(--glass-rim);
      box-shadow: var(--glass-lens);
      color: var(--text);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.4s var(--spring), border-color 0.1s ease, color 0.1s ease;
    }

    .qty-btn:active {
      transform: scale(0.92);
      border-color: var(--accent);
      color: var(--accent);
      transition-duration: 0.1s;
    }

    .cart-item.completed .qty-btn {
      display: none !important;
    }

    .item-qty-badge {
      font-size: 13px;
      font-weight: 600;
      min-width: 18px;
      text-align: center;
    }

    .cart-item.completed .item-qty-badge {
      font-size: 11.5px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 2px 7px;
      border-radius: 999px;
    }

    .cart-item.completed .item-qty-badge::before {
      content: '×';
    }

    .delete-btn {
      position: relative;
      width: 28px;
      height: 28px;
      border: 1px solid rgba(255, 69, 58, 0.25);
      background: var(--danger-surface);
      color: var(--danger);
      border-radius: 8px;
      font-size: 18px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.4s var(--spring);
    }

    .cart-item.completed .delete-btn {
      display: flex;
    }

    .delete-btn:active {
      transform: scale(0.92);
      transition-duration: 0.1s;
    }

    .list-footer {
      padding-top: 8px;
      display: flex;
      justify-content: flex-end;
    }

    .clear-all {
      position: relative;
      color: var(--danger);
      background: var(--danger-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid rgba(255, 69, 58, 0.25);
      box-shadow: var(--glass-lens);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.4s var(--spring);
    }

    .clear-all:active {
      transform: scale(0.95);
      transition-duration: 0.12s;
    }

    .note-card {
      position: relative;
      background: var(--glass-fill-elevated);
      border: var(--glass-rim);
      border-radius: var(--radius);
      box-shadow: var(--glass-lens);
      cursor: pointer;
      touch-action: manipulation;
      contain: layout style paint;
      content-visibility: auto;
      contain-intrinsic-size: auto 76px;
      transition: transform 0.45s var(--spring), border-color 0.14s ease;
    }

    .note-card:active {
      transform: scale(0.98);
      background: rgba(0, 255, 136, 0.06);
      border-color: var(--accent);
      transition-duration: 0.14s;
    }

    .note-open {
      display: block;
      width: 100%;
      padding: 14px;
      background: none;
      border: 0;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      touch-action: manipulation;
    }

    .note-title {
      display: block;
      font-size: 14.5px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
      padding-right: 32px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .note-body {
      display: block;
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--text);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .note-date {
      display: block;
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 8px;
      text-align: right;
    }

    .delete-note {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--danger-surface);
      color: var(--danger);
      border: 1px solid rgba(255, 69, 58, 0.25);
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      z-index: 2;
      touch-action: manipulation;
      transition: transform 0.4s var(--spring);
    }

    .delete-note:active {
      transform: scale(0.9);
      transition-duration: 0.12s;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 50px 20px;
      grid-column: 1 / -1;
      list-style: none;
    }

    .empty-state-icon {
      font-size: 42px;
      margin-bottom: 10px;
      opacity: 0.5;
    }

    .empty-state-text {
      font-size: 13.5px;
      line-height: 1.5;
    }

    /* The overlay only dims (no backdrop-filter, no opacity): an ancestor with backdrop-filter or
       opacity<1 becomes a "backdrop root" and would hide the panels from the glass pane inside it.
       Hidden state uses visibility so nothing is rendered and the dialog leaves the tab order. */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      visibility: hidden;
      pointer-events: none;
      transition: background-color 0.22s ease, visibility 0s linear 0.22s;
      padding: 20px;
    }

    .modal.active {
      background: rgba(0, 0, 0, 0.32);
      visibility: visible;
      pointer-events: auto;
      transition: background-color 0.22s ease, visibility 0s;
    }

    .modal-content {
      position: relative;
      background: var(--glass-fill-elevated);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: var(--glass-rim);
      border-radius: calc(var(--radius) + 2px);
      box-shadow: var(--glass-lens), 0 20px 40px rgba(0, 0, 0, 0.45);
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      max-height: 85dvh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      opacity: 0;
      transform: translateY(16px) scale(0.98);
      transition: transform 0.45s var(--spring), opacity 0.22s ease;
    }

    /* Soft sheen across the pane, like light sliding over curved glass */
    .modal-content::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      z-index: -1;
      background: linear-gradient(155deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.035) 28%, transparent 55%);
    }

    .modal.active .modal-content {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .note-form {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .unified-note-input {
      width: 100%;
      min-height: 110px;
      max-height: 50vh;
      max-height: 50dvh;
      padding: 13px;
      margin-bottom: 12px;
      background: rgba(0, 0, 0, 0.32);
      border: var(--glass-rim);
      border-radius: var(--radius);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
      color: var(--text);
      font-size: 16px; /* >=16px prevents iOS auto-zoom on focus */
      line-height: 1.5;
      resize: none;
      overflow-y: auto;
      overscroll-behavior: contain;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .unified-note-input::placeholder {
      color: var(--muted);
    }

    .unified-note-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow), inset 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      position: relative;
      padding: 9px 16px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.4s var(--spring);
    }

    .btn:active {
      transform: scale(0.95);
      transition-duration: 0.12s;
    }

    .btn-cancel {
      background: var(--glass-fill);
      color: var(--muted);
      border: var(--glass-rim);
    }

    .btn-save {
      background: var(--accent);
      color: #000;

       Screen readers are served by the separate #live-region. */

      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--glass-fill-elevated);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid rgba(0, 255, 136, 0.3);
      color: var(--accent);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: transform 0.22s ease, opacity 0.22s ease, visibility 0s linear 0.22s;
      z-index: 1200;
      box-shadow: var(--glass-lens), 0 6px 20px rgba(0, 0, 0, 0.4), 0 0 12px var(--accent-glow);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      visibility: visible;
      transition: transform 0.22s ease, opacity 0.22s ease, visibility 0s;
    }

    /* ===== Liquid Glass reaction: light that follows your finger under the glass =====
       --gx / --gy are set from JS on pointerdown. Only the pressed element is repainted. */
    .product-card::after,
    .note-card::after,
    .qty-btn::after,
    .btn::after,
    .add-btn::after,
    .clear-all::after,
    .delete-btn::after,
    .delete-note::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%),
        rgba(255, 255, 255, 0.34) 0%,
        rgba(255, 255, 255, 0.12) 38%,
        transparent 72%);
      opacity: 0;
      transition: opacity 0.45s ease;
    }

    .product-card:active::after,
    .note-card:active::after,
    .qty-btn:active::after,
    .btn:active::after,
    .add-btn:active::after,
    .clear-all:active::after,
    .delete-btn:active::after,
    .delete-note:active::after {
      opacity: 1;
      transition-duration: 0.08s;
    }

    /* Pressing the delete button must not light up the whole note */
    .note-card:has(.delete-note:active)::after {
      opacity: 0;
    }

       The filter bends the backdrop near the rim like a thick glass lens; a hair of blur hides

        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;

    @media (prefers-reduced-transparency: reduce) {

      }

    /* =====================================================================
       Ambient Green Orbs – Aparición aleatoria + movimiento continuo + pulso lento
       Ejecutado en el compositor GPU (Web Animations API) sin tocar jamás los bordes.
       ===================================================================== */
    function setupAmbientOrbs() {
      if (!ambientEl) return;
      const GREEN_PALETTE = [
        '0, 255, 136',  // Esmeralda
        '0, 185, 95',   // Jade oscuro
        '16, 225, 118', // Verde bosque
        '0, 210, 110'   // Verde abisal
      ];

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const canAnimate = 'animate' in Element.prototype && !reducedMotion;
      const ORB_COUNT = 4;
      const orbs = [];

      const rand = (min, max) => min + Math.random() * (max - min);

      function getSafeBounds() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const minDim = Math.min(vw, vh);
        // Tamaño de la esfera contenido para dejar amplio recorrido interior sin tocar bordes
        const size = Math.round(Math.max(160, Math.min(340, minDim * 0.44)));
        const radius = size * 0.5;
        // Margen extra desde el borde para que ni siquiera la cola Gaussiana se acerque al límite
        const padX = Math.max(radius * 0.92, vw * 0.15);
        const padY = Math.max(radius * 0.92, vh * 0.13);

        const minX = padX;
        const maxX = Math.max(minX + 20, vw - padX);
        const minY = padY;
        const maxY = Math.max(minY + 20, vh - padY);

        return { size, radius, minX, maxX, minY, maxY };
      }

      function pickPoint(bounds, avoidPoint = null) {
        const spanX = bounds.maxX - bounds.minX;
        const spanY = bounds.maxY - bounds.minY;
        const minDist = Math.hypot(spanX, spanY) * 0.28;
        let best = null;
        let bestDist = -1;

        for (let i = 0; i < 6; i++) {
          const x = rand(bounds.minX, bounds.maxX);
          const y = rand(bounds.minY, bounds.maxY);
          if (!avoidPoint) return { x, y };
          const d = Math.hypot(x - avoidPoint.x, y - avoidPoint.y);
          if (d >= minDist) return { x, y };
          if (d > bestDist) {
            bestDist = d;
            best = { x, y };
          }
        }
        return best;
      }

      function launchOrbCycle(orb, initialPhase = 0) {
        const b = getSafeBounds();
        orb.el.style.setProperty('--orb-size', `${b.size}px`);
        orb.el.style.setProperty('--orb-rgb', GREEN_PALETTE[Math.floor(Math.random() * GREEN_PALETTE.length)]);

        // 1. Nace en una zona aleatoria segura (totalmente apagado)
        const pStart = pickPoint(b);
        // 2. Se desplaza hacia otra zona aleatoria alejada pasando por un punto intermedio curvo
        const pEnd = pickPoint(b, pStart);
        const jitterX = (b.maxX - b.minX) * 0.16;
        const jitterY = (b.maxY - b.minY) * 0.16;
        const pMid = {
          x: Math.min(b.maxX, Math.max(b.minX, (pStart.x + pEnd.x) * 0.5 + rand(-jitterX, jitterX))),
          y: Math.min(b.maxY, Math.max(b.minY, (pStart.y + pEnd.y) * 0.5 + rand(-jitterY, jitterY)))
        };

        const r = b.radius;
        const tx0 = Math.round(pStart.x - r), ty0 = Math.round(pStart.y - r);
        const txM = Math.round(pMid.x - r),   tyM = Math.round(pMid.y - r);
        const tx1 = Math.round(pEnd.x - r),   ty1 = Math.round(pEnd.y - r);

        if (!canAnimate) {
          orb.el.style.transform = `translate3d(${txM}px, ${tyM}px, 0)`;
          orb.el.style.opacity = '0.55';
          return;
        }

        const duration = Math.round(rand(7200, 11200));

        if (orb.anim) orb.anim.cancel();
        const anim = orb.el.animate([
          {
            transform: `translate3d(${tx0}px, ${ty0}px, 0) scale(0.82)`,
            opacity: 0,
            offset: 0
          },
          {
            transform: `translate3d(${Math.round((tx0 + txM) * 0.5)}px, ${Math.round((ty0 + tyM) * 0.5)}px, 0) scale(0.96)`,
            opacity: 0.45,
            offset: 0.25
          },
          {
            transform: `translate3d(${txM}px, ${tyM}px, 0) scale(1.08)`,
            opacity: 1,
            offset: 0.5
          },
          {
            transform: `translate3d(${Math.round((txM + tx1) * 0.5)}px, ${Math.round((tyM + ty1) * 0.5)}px, 0) scale(0.96)`,
            opacity: 0.45,
            offset: 0.75
          },
          {
            transform: `translate3d(${tx1}px, ${ty1}px, 0) scale(0.84)`,
            opacity: 0,
            offset: 1
          }
        ], {
          duration,
          easing: 'ease-in-out',
          fill: 'forwards'
        });

        if (initialPhase > 0) {
          anim.currentTime = Math.round(duration * initialPhase);
        }

        orb.anim = anim;
        // Cuando termina de apagarse (opacity: 0), salta a una nueva zona aleatoria y repite
        anim.onfinish = () => launchOrbCycle(orb, 0);
      }

      const frag = document.createDocumentFragment();
      for (let i = 0; i < ORB_COUNT; i++) {
        const el = document.createElement('div');
        el.className = 'ambient-orb';
        frag.appendChild(el);
        orbs.push({ el, anim: null });
      }
      ambientEl.appendChild(frag);

      // Arranca los 4 focos en fases desfasadas para que haya actividad inmediata y asíncrona
      orbs.forEach((orb, idx) => {
        launchOrbCycle(orb, (idx + 0.35) / ORB_COUNT);
      });

      let resizeTimer = 0;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          orbs.forEach((orb, idx) => launchOrbCycle(orb, (idx + 0.25) / ORB_COUNT));
        }, 180);
      }, { passive: true });
    }

        }
      }

      if (!localStorage.getItem(KEYS.NOTES)) {
        for (const oldKey of LEGACY_KEYS.NOTES) {
          const legacy = store.get(oldKey, null);
          if (legacy && legacy.length > 0) {
            store.set(KEYS.NOTES, legacy);
            break;
          }
        }
      }
    }

    function parseValidDate(d) {
      const parsed = new Date(d);
      return isNaN(parsed.getTime()) ? new Date() : parsed;
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      liveRegion.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 1500);
    }

    function autoResizeTextarea(force = false) {
      if (force) {
        noteTextInput.style.height = 'auto';
        const h = noteTextInput.scrollHeight;
        lastTextareaScrollH = h;
        noteTextInput.style.height = `${h}px`;
        return;
      }
      const sh = noteTextInput.scrollHeight;
      const ch = noteTextInput.clientHeight;
      if (sh > ch || sh < lastTextareaScrollH - 16) {
        noteTextInput.style.height = 'auto';
        const nextH = noteTextInput.scrollHeight;
        if (nextH !== lastTextareaScrollH) {
          lastTextareaScrollH = nextH;
          noteTextInput.style.height = `${nextH}px`;
        } else {
          noteTextInput.style.height = `${ch}px`;
        }
      }
    }
    noteTextInput.addEventListener('input', () => autoResizeTextarea(false));

    document.addEventListener('click', e => {
      if (performance.now() < suppressClicksUntil) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    }, true);

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && noteModal.classList.contains('active')) closeNoteModal();
    });

    /* =====================================================================
       Liquid Glass – real refraction (Chromium: Chrome, Edge, Android)
       backdrop-filter: url(#svg-filter) is only honoured by Chromium. Safari (all iOS
       browsers) and Firefox ignore it, so there we keep the translucent CSS fallback.
       ===================================================================== */
    const supportsBackdropRefraction = (() => {
      if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) return false;          // iOS = WebKit
      const brands = navigator.userAgentData && navigator.userAgentData.brands;
      if (brands) return brands.some(b => b.brand === 'Chromium');
      return Boolean(window.chrome) && !/Firefox/i.test(navigator.userAgent);
    })();

    const LENS_SELECTOR = '.search-input, .clear-all, .modal-content, .toast';
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const lensEntries = new Map();
    let lensDefs = null;
    let lensCanvas = null;

    /* Displacement map rendered at 0.5x resolution (bilinearly interpolated by feImage)
       with fast Uint32Array fill and inner-rectangle culling (~12x faster on CPU). */
    function makeLensMap(w, h, radius, bezel) {
      const scale = 0.5;
      const mw = Math.max(4, Math.round(w * scale));
      const mh = Math.max(4, Math.round(h * scale));
      const mr = radius * scale;
      const mb = bezel * scale;

      if (!lensCanvas) lensCanvas = document.createElement('canvas');
      lensCanvas.width = mw;
      lensCanvas.height = mh;
      const ctx = lensCanvas.getContext('2d');
      const img = ctx.createImageData(mw, mh);
      const data = img.data;

      // Little-endian ABGR for neutral displacement rgba(128, 128, 128, 255)
      new Uint32Array(data.buffer).fill(0xFF808080);

      const hw = mw * 0.5, hh = mh * 0.5;
      const bx = hw - mr, by = hh - mr;
      const flatLimit = Math.min(0, mr - mb);
      const invBezel = 1 / mb;

      for (let y = 0; y < mh; y++) {
        const py = y + 0.5 - hh;
        const absPy = Math.abs(py);
        const qy = absPy - by;
        const signY = py < 0 ? -1 : 1;
        const yInFlat = qy <= flatLimit;
        const rowOffset = y * mw;

        for (let x = 0; x < mw; x++) {
          const px = x + 0.5 - hw;
          const qx = Math.abs(px) - bx;

          // Fast skip across the flat interior of the row
          if (yInFlat && qx <= flatLimit) {
            const skipTo = Math.floor(hw + bx + flatLimit - 0.5);
            if (x < skipTo) x = skipTo;
            continue;
          }

          const signX = px < 0 ? -1 : 1;
          let gx, gy, dist;
          if (qx > 0 && qy > 0) {
            const len = Math.hypot(qx, qy) || 1;
            gx = (qx / len) * signX;
            gy = (qy / len) * signY;
            dist = len - mr;
          } else if (qx > qy) {
            gx = signX; gy = 0; dist = qx - mr;
          } else {
            gx = 0; gy = signY; dist = qy - mr;
          }

          const inside = -dist;
          if (inside < mb) {
            const t = 1 - Math.max(0, inside) * invBezel;
            const m = t * t * Math.sqrt(t); // fast approximation of t^2.4
            const i = (rowOffset + x) << 2;
            data[i] = 128 - gx * m * 127;
            data[i + 1] = 128 - gy * m * 127;
          }
        }
      }
      ctx.putImageData(img, 0, 0);
      return lensCanvas.toDataURL();
    }

    function buildLens(el) {
      const w = Math.round(el.offsetWidth), h = Math.round(el.offsetHeight);
      if (w < 8 || h < 8) return;

      let entry = lensEntries.get(el);
      if (entry && entry.w === w && entry.h === h) return;

      if (!entry) {
        const filter = document.createElementNS(SVG_NS, 'filter');
        filter.id = `lg-lens-${lensEntries.size}`;
        filter.setAttribute('filterUnits', 'userSpaceOnUse');
        filter.setAttribute('color-interpolation-filters', 'sRGB');

        const feImage = document.createElementNS(SVG_NS, 'feImage');
        feImage.setAttribute('preserveAspectRatio', 'none');
        feImage.setAttribute('result', 'map');

        const disp = document.createElementNS(SVG_NS, 'feDisplacementMap');
        disp.setAttribute('in', 'SourceGraphic');
        disp.setAttribute('in2', 'map');
        disp.setAttribute('xChannelSelector', 'R');
        disp.setAttribute('yChannelSelector', 'G');

        filter.append(feImage, disp);
        lensDefs.appendChild(filter);
        entry = { filter, feImage, disp, base: 0, cur: 0, factor: 1, raf: 0, w: 0, h: 0 };
        lensEntries.set(el, entry);
      }

      entry.w = w;
      entry.h = h;

      const radius = Math.min(parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0, w / 2, h / 2);
      const bezel = Math.max(8, Math.min(22, Math.min(w, h) * 0.3));

      for (const node of [entry.filter, entry.feImage]) {
        node.setAttribute('x', 0);
        node.setAttribute('y', 0);
        node.setAttribute('width', w);
        node.setAttribute('height', h);
      }
      entry.feImage.setAttribute('href', makeLensMap(w, h, radius, bezel));

      entry.base = bezel * 1.7;
      entry.cur = entry.base * entry.factor;
      entry.disp.setAttribute('scale', entry.cur.toFixed(2));

      el.style.setProperty('--lg-url', `url(#${entry.filter.id})`);
      el.classList.add('lg-ready');
    }

    /* The lens "bulges" (stronger refraction) while pressed or focused, and relaxes on release */
    function bulgeLens(el, factor) {
      const entry = lensEntries.get(el);
      if (!entry) return;
      entry.factor = factor;
      const from = entry.cur, to = entry.base * factor, t0 = performance.now(), dur = 160;
      cancelAnimationFrame(entry.raf);
      const step = now => {
        const k = Math.min(1, (now - t0) / dur);
        const inv = 1 - k;
        entry.cur = from + (to - from) * (1 - inv * inv * inv);
        entry.disp.setAttribute('scale', entry.cur.toFixed(2));
        if (k < 1) entry.raf = requestAnimationFrame(step);
      };
      entry.raf = requestAnimationFrame(step);
    }

    function setupLiquidLens() {
      if (!supportsBackdropRefraction || !('ResizeObserver' in window)) return;

      const svg = document.createElementNS(SVG_NS, 'svg');
      svg.setAttribute('width', '0');
      svg.setAttribute('height', '0');
      svg.setAttribute('aria-hidden', 'true');
      svg.setAttribute('focusable', 'false');
      svg.style.position = 'absolute';
      lensDefs = document.createElementNS(SVG_NS, 'defs');
      svg.appendChild(lensDefs);
      document.body.appendChild(svg);

      const pending = new Set();
      let raf = 0;
      const observer = new ResizeObserver(records => {
        records.forEach(r => pending.add(r.target));
        if (!raf) {
          raf = requestAnimationFrame(() => {
            raf = 0;
            pending.forEach(buildLens);
            pending.clear();
          });
        }
      });
      document.querySelectorAll(LENS_SELECTOR).forEach(el => observer.observe(el));

      document.addEventListener('focusin', e => {
        if (e.target.matches('.search-input')) bulgeLens(e.target, 1.6);
      });
      document.addEventListener('focusout', e => {
        if (e.target.matches('.search-input')) bulgeLens(e.target, 1);
      });
    }

    // Liquid Glass: the specular highlight under the glass follows the touch/pointer position
    const GLASS_REACTIVE = '.product-card, .note-card, .qty-btn, .btn, .add-btn, .clear-all, .delete-btn, .delete-note';
    let pressedLens = null;
    document.addEventListener('pointerdown', e => {
      const el = e.target.closest(GLASS_REACTIVE);
      if (!el) return;
      const r = el.getBoundingClientRect();
      el.style.setProperty('--gx', `${Math.round(e.clientX - r.left)}px`);
      el.style.setProperty('--gy', `${Math.round(e.clientY - r.top)}px`);
      if (lensEntries.has(el)) {
        pressedLens = el;
        bulgeLens(el, 1.6);
      }
    }, { passive: true });

    const releaseLens = () => {
      if (pressedLens) {
        bulgeLens(pressedLens, 1);
        pressedLens = null;
      }
    };
    document.addEventListener('pointerup', releaseLens, { passive: true });
    document.addEventListener('pointercancel', releaseLens, { passive: true });

    window.addEventListener('storage', e => {
      if (!e.key) return;
      if (e.key === KEYS.CART) {
        syncCart();
        renderCart();
      } else if (e.key === KEYS.NOTES) {
        syncNotes();
        renderNotes(searchNotesInput.value);
      } else if (e.key === KEYS.PRODUCTS) {
        syncProducts();
        renderProducts(searchInput.value);
      }
    });

    function syncProducts() {
      const storedProducts = store.get(KEYS.PRODUCTS, []);
      if (!storedProducts.length) {
        products = defaultProducts.map(name => ({ name, norm: normalize(name) }));
        store.set(KEYS.PRODUCTS, products.map(p => ({ name: p.name })));
      } else {
        const seen = new Set();
        products = [];
        for (let i = 0; i < storedProducts.length; i++) {
          const p = storedProducts[i];
          const name = (typeof p === 'string' ? p : (p && p.name ? p.name : '')).trim();
          if (!name) continue;
          const norm = normalize(name);
          if (seen.has(norm)) continue;
          seen.add(norm);
          products.push({ name, norm });
        }
        products.sort((a, b) => collator.compare(a.name, b.name));
      }
    }

    function syncCart() {
      const storedCart = store.get(KEYS.CART, []);
      cartItems = storedCart.map(i => {
        const name = String(i.name || '').trim();
        return {
          id: String(i.id || generateId()),
          name,
          norm: normalize(name),
          qty: Math.max(1, parseInt(i.qty, 10) || 1),
          completed: Boolean(i.completed)
        };
      }).filter(i => i.name);
    }

    function syncNotes() {
      const storedNotes = store.get(KEYS.NOTES, []);
      notes = storedNotes.map(n => {
        const fallbackText = [n.title, n.content].filter(Boolean).join('\n');
        const text = String(n.text ?? fallbackText ?? '');
        const validDate = parseValidDate(n.date);
        return {
          id: String(n.id || generateId()),
          text,
          norm: normalize(text),
          date: validDate.toISOString(),
          formattedDate: dateFormatter.format(validDate)
        };
      });
    }

    function initApp() {
      recoverLegacyStorage();
      syncProducts();
      syncCart();
      syncNotes();

      renderProducts();
      renderCart();
      renderNotes();
      setupTouchSwipe();
      setupModalKeyboardSync();
    }

    /* Only the visible panel (and the dialog, when open) is reachable by keyboard / screen readers */
    function syncPanelA11y() {
      const modalOpen = noteModal.classList.contains('active');
      panels.forEach((p, i) => { p.inert = modalOpen || i !== currentPanel; });
      panelNav.inert = modalOpen;
      panelNavButtons.forEach((b, i) => {
        if (i === currentPanel) b.setAttribute('aria-current', 'true');
        else b.removeAttribute('aria-current');
      });
    }

    function getRealContainerX() {
      if (!isAnimating) return currentContainerX;
      const style = window.getComputedStyle(panelsContainer);
      const transform = style.transform || style.webkitTransform;
      if (transform && transform !== 'none') {
        const matrix = new DOMMatrixReadOnly(transform);
        return matrix.m41;
      }
      return currentContainerX;
    }

    function setContainerPosition(offsetPx, durationMs = 0, easing = ADAPTIVE_EASING) {
      currentContainerX = offsetPx;
      clearTimeout(animEndTimer);
      if (durationMs > 0) {
        isAnimating = true;
        panelsContainer.style.transition = `transform ${durationMs}ms ${easing}`;
        animEndTimer = setTimeout(() => { isAnimating = false; }, durationMs + 20);
      } else {
        isAnimating = false;
        panelsContainer.style.transition = 'none';
      }
      panelsContainer.style.transform = `translate3d(${offsetPx}px, 0, 0)`;
    }

    panelsContainer.addEventListener('transitionend', e => {
      if (e.target === panelsContainer) {
        isAnimating = false;
        clearTimeout(animEndTimer);
      }
    });

    function snapToPanel(index, duration = 380, easing = ADAPTIVE_EASING) {
      currentPanel = Math.max(0, Math.min(2, index));
      setContainerPosition(-currentPanel * window.innerWidth, duration, easing);
      syncPanelA11y();
    }

    panelNav.addEventListener('click', e => {
      const btn = e.target.closest('button[data-panel]');
      if (btn) snapToPanel(Number(btn.dataset.panel));
    });

    function setupTouchSwipe() {
      let startX = 0, startY = 0, currentX = 0;
      let isDragging = false;
      let isHorizontal = null;
      let dragBaseOffset = 0;
      let pendingTargetX = 0;
      let rAf = null;
      let velocitySamples = [];
      let lastWidth = window.innerWidth;
      let interruptedAnimation = false;

      // Listeners are scoped to the panels container (not document) so the non-passive
      // touchmove never delays scrolling inside the modal or other UI.
      panelsContainer.addEventListener('touchstart', e => {
        if (e.touches.length > 1) return;
        // Small controls keep their tap; large tappable cards/toggles can start a swipe.
        if (e.target.closest('input, textarea, .qty-btn, .delete-btn, .delete-note, .add-btn, .clear-all')) return;

        const t = e.touches[0];
        startX = currentX = t.clientX;
        startY = t.clientY;
        isDragging = true;
        isHorizontal = null;

        const now = performance.now();
        velocitySamples = [{ x: startX, t: now }];

        if (isAnimating) {
          interruptedAnimation = true;
          dragBaseOffset = getRealContainerX();
          setContainerPosition(dragBaseOffset, 0);
        } else {
          interruptedAnimation = false;
          dragBaseOffset = -currentPanel * window.innerWidth;
          currentContainerX = dragBaseOffset;
        }
        pendingTargetX = dragBaseOffset;
      }, { passive: true });

      panelsContainer.addEventListener('touchmove', e => {
        if (!isDragging || e.touches.length > 1) return;

        const t = e.touches[0];
        const dx = t.clientX - startX;
        const dy = t.clientY - startY;
        const absX = Math.abs(dx);
        const absY = Math.abs(dy);

        if (isHorizontal === null) {
          if (absX > 6 || absY > 6) {
            isHorizontal = absX > absY * 1.15;
            if (!isHorizontal) {
              isDragging = false;
              if (interruptedAnimation) {
                snapToPanel(currentPanel, 220);
                interruptedAnimation = false;
              }
              return;
            }
          } else {
            return;
          }
        }

        if (!isHorizontal) return;
        if (e.cancelable) e.preventDefault();

        currentX = t.clientX;

        const now = performance.now();
        velocitySamples.push({ x: currentX, t: now });
        while (velocitySamples.length > 1 && now - velocitySamples[0].t > 85) {
          velocitySamples.shift();
        }

        const w = window.innerWidth;
        let targetX = dragBaseOffset + dx;

        if (targetX > 0) {
          targetX = Math.pow(targetX, 0.82) * 2.8;
        } else if (targetX < -2 * w) {
          const over = targetX - (-2 * w);
          targetX = -2 * w - Math.pow(Math.abs(over), 0.82) * 2.8;
        }

        pendingTargetX = targetX;

        if (!rAf) {
          rAf = requestAnimationFrame(() => {
            setContainerPosition(pendingTargetX, 0);
            rAf = null;
          });
        }
      }, { passive: false });

      const onDragEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        if (rAf) {
          cancelAnimationFrame(rAf);
          rAf = null;
          setContainerPosition(pendingTargetX, 0);
        }

        if (isHorizontal) {
          const w = window.innerWidth;
          let velocity = 0;

          if (velocitySamples.length >= 2) {
            const first = velocitySamples[0];
            const last = velocitySamples[velocitySamples.length - 1];
            const dt = Math.max(1, last.t - first.t);
            velocity = (last.x - first.x) / dt;
          }

          const dx = currentX - startX;
          const absV = Math.abs(velocity);
          const isFlick = absV > 0.24;

          if (isFlick) {
            if (velocity < -0.24 && currentPanel < 2) currentPanel++;
            else if (velocity > 0.24 && currentPanel > 0) currentPanel--;
          } else {
            if (dx < -w * 0.25 && currentPanel < 2) currentPanel++;
            else if (dx > w * 0.25 && currentPanel > 0) currentPanel--;
          }

          const targetX = -currentPanel * w;
          const remainingDistance = Math.abs(targetX - currentContainerX);

          let duration;
          if (isFlick) {
            duration = Math.round(remainingDistance / (absV * 1.15));
            duration = Math.max(260, Math.min(390, duration));
          } else {
            const ratio = Math.min(1, remainingDistance / w);
            duration = Math.round(300 + ratio * 90);
          }

          suppressClicksUntil = performance.now() + 80;
          setContainerPosition(targetX, duration, ADAPTIVE_EASING);
          syncPanelA11y();
        } else if (interruptedAnimation) {
          snapToPanel(currentPanel, 220);
        }
        interruptedAnimation = false;
      };

      panelsContainer.addEventListener('touchend', onDragEnd, { passive: true });
      panelsContainer.addEventListener('touchcancel', onDragEnd, { passive: true });

      window.addEventListener('resize', () => {
        const w = window.innerWidth;
        if (w !== lastWidth) {
          lastWidth = w;
          snapToPanel(currentPanel, 0);
        }
      }, { passive: true });
    }

    function renderProducts(query = '') {
      const q = normalize(query);
      let html = '';
      let count = 0;
      let exactMatch = false;

      for (let i = 0, l = products.length; i < l; i++) {
        const p = products[i];
        if (p.norm === q) exactMatch = true;
        if (!q || p.norm.includes(q)) {
          count++;
          html += `<button type="button" class="product-card" data-idx="${i}">${esc(p.name)}</button>`;
        }
      }

      productsGrid.innerHTML = count ? html : `
        <div class="empty-state">
          <div class="empty-state-icon" aria-hidden="true">🔍</div>
          <p class="empty-state-text">No se encontraron productos.<br>Pulsa <strong>Añadir</strong> para agregarlo.</p>
        </div>`;
      addBtn.hidden = !(q && !exactMatch);
    }

    productsGrid.addEventListener('click', e => {
      const card = e.target.closest('.product-card');
      if (!card) return;
      const item = products[Number(card.dataset.idx)];
      if (item) addToCart(item.name);
    });

    function addToCart(name) {
      const trimmed = (name || '').trim();
      if (!trimmed) return;

      const norm = normalize(trimmed);
      const existing = cartItems.find(i => i.norm === norm);
      if (existing) {
        existing.qty++;
        existing.completed = false;
      } else {
        cartItems.push({ id: generateId(), name: trimmed, norm, qty: 1, completed: false });
      }
      saveCartToStorage();
      scheduleCartRender();
      showToast(`Añadido: ${trimmed}`);
    }

    let searchTimer = null;
    searchInput.addEventListener('input', e => {
      const val = e.target.value;
      cancelAnimationFrame(searchTimer);
      searchTimer = requestAnimationFrame(() => renderProducts(val));
    });

    function handleAddProductFromInput() {
      const rawName = searchInput.value.trim();
      if (!rawName) return;
      const norm = normalize(rawName);

      let productToAdd = products.find(p => p.norm === norm);
      if (!productToAdd) {
        productToAdd = { name: rawName, norm };
        products.push(productToAdd);
        products.sort((a, b) => collator.compare(a.name, b.name));
        store.set(KEYS.PRODUCTS, products.map(p => ({ name: p.name })));
      }

      addToCart(productToAdd.name);
      searchInput.value = '';
      addBtn.hidden = true;
      renderProducts();
    }

    addBtn.addEventListener('click', handleAddProductFromInput);
    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleAddProductFromInput();
      }
    });

    function renderCart() {
      if (!cartItems.length) {
        cartList.innerHTML = `
          <li class="empty-state">
            <div class="empty-state-icon" aria-hidden="true">🛒</div>
            <p class="empty-state-text">Tu lista está vacía.<br>Añade productos desde <strong>Explorar</strong>.</p>
          </li>`;
        listFooter.hidden = true;
        return;
      }

      listFooter.hidden = false;

      const sorted = [...cartItems].sort((a, b) => {
        if (a.completed === b.completed) return collator.compare(a.name, b.name);
        return a.completed ? 1 : -1;
      });

      let html = '';
      for (let i = 0, l = sorted.length; i < l; i++) {
        const item = sorted[i];
        const id = esc(item.id);
        const name = esc(item.name);
        const isDone = item.completed ? ' completed' : '';
        html += `
          <li class="cart-item${isDone}" data-id="${id}">
            <button type="button" class="item-toggle-wrap" data-action="toggle" aria-pressed="${item.completed}">
              <span class="item-checkbox" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </span>
              <span class="item-name">${name}</span>
            </button>
            <div class="cart-controls">
              <button type="button" class="qty-btn" data-action="dec" aria-label="Disminuir cantidad de ${name}">−</button>
              <span class="item-qty-badge">${item.qty}</span>
              <button type="button" class="qty-btn" data-action="inc" aria-label="Aumentar cantidad de ${name}">+</button>
              <button type="button" class="delete-btn" data-action="del" aria-label="Eliminar ${name}">×</button>
            </div>
          </li>`;
      }
      cartList.innerHTML = html;
    }

    cartList.addEventListener('click', e => {
      const itemEl = e.target.closest('.cart-item');
      if (!itemEl) return;
      const id = itemEl.dataset.id;

      const item = cartItems.find(i => String(i.id) === id);
      if (!item) return;

      const actionBtn = e.target.closest('button');
      const action = actionBtn ? actionBtn.dataset.action : null;
      let toggled = false;

      if (action === 'inc') {
        if (item.completed) return;
        item.qty++;
        const badge = itemEl.querySelector('.item-qty-badge');
        if (badge) badge.textContent = item.qty;
        saveCartToStorage();
        return;
      } else if (action === 'dec') {
        if (item.completed) return;
        if (item.qty > 1) {
          item.qty--;
          const badge = itemEl.querySelector('.item-qty-badge');
          if (badge) badge.textContent = item.qty;
          saveCartToStorage();
          return;
        }
        cartItems = cartItems.filter(i => String(i.id) !== id);
      } else if (action === 'del') {
        cartItems = cartItems.filter(i => String(i.id) !== id);
      } else {
        item.completed = !item.completed;
        toggled = true;
      }

      saveCartToStorage();
      renderCart();

      // The list is re-rendered, so give keyboard users their focus back
      if (e.detail === 0) {
        const targetBtn = toggled
          ? cartList.querySelector(`[data-id="${CSS.escape(id)}"] [data-action="toggle"]`)
          : cartList.querySelector('[data-action="toggle"]');
        if (targetBtn) targetBtn.focus();
      }
    });

    $('clear-all').addEventListener('click', () => {
      if (cartItems.length && confirm('¿Vaciar toda la lista?')) {
        cartItems = [];
        saveCartToStorage();
        renderCart();
      }
    });

    function parseNoteParts(rawText) {
      const lines = (rawText || '').trim().split(/\r?\n/);
      const title = lines[0] || 'Nota';
      const body = lines.slice(1).join('\n').trim();
      return { title, body };
    }

    function renderNotes(query = '') {
      const q = normalize(query);
      let html = '';
      let count = 0;

      for (let i = 0, l = notes.length; i < l; i++) {
        const note = notes[i];
        if (!q || note.norm.includes(q)) {
          count++;
          const id = esc(note.id);
          const { title, body } = parseNoteParts(note.text);
          html += `
            <li class="note-card" data-id="${id}">
              <button type="button" class="note-open" aria-label="Editar nota: ${esc(title)}">
                <span class="note-title">${esc(title)}</span>
                ${body ? `<span class="note-body">${esc(body)}</span>` : ''}
                <time class="note-date" datetime="${esc(note.date)}">${esc(note.formattedDate)}</time>
              </button>
              <button type="button" class="delete-note" data-delete-id="${id}" aria-label="Eliminar nota: ${esc(title)}">×</button>
            </li>`;
        }
      }

      notesGrid.innerHTML = count ? html : `
        <li class="empty-state">
          <div class="empty-state-icon" aria-hidden="true">📝</div>
          <p class="empty-state-text">${q ? 'No se encontraron notas.' : 'No hay notas.<br>¡Crea tu primera nota!'}</p>
        </li>`;
    }

    notesGrid.addEventListener('click', e => {
      const delBtn = e.target.closest('.delete-note');
      if (delBtn) {
        e.stopPropagation();
        const id = delBtn.dataset.deleteId;
        if (confirm('¿Eliminar esta nota?')) {
          notes = notes.filter(n => n.id !== id);
          store.set(KEYS.NOTES, notes.map(n => ({ id: n.id, text: n.text, date: n.date })));
          renderNotes(searchNotesInput.value);
        }
        return;
      }

      const card = e.target.closest('.note-card');
      if (card) {
        const note = notes.find(n => n.id === card.dataset.id);
        if (note) openNoteModal(note);
      }
    });

    function openNoteModal(note = null) {
      const active = document.activeElement;
      lastFocused = active && active !== document.body ? active : null;
      currentNote = note;
      noteTextInput.value = note ? note.text : '';
      noteModal.classList.add('active');
      syncPanelA11y();
      requestAnimationFrame(() => {
        autoResizeTextarea(true);
        noteTextInput.scrollTop = 0;
        noteTextInput.focus({ preventScroll: true });
      });
    }

    function closeNoteModal() {
      noteModal.classList.remove('active');
      noteTextInput.blur();
      currentNote = null;
      modalContent.style.maxHeight = '';
      syncPanelA11y();

      // Return focus to whatever opened the dialog (or the "new note" button if it was re-rendered)
      if (lastFocused) {
        const target = lastFocused.isConnected ? lastFocused : (addNoteBtn.hidden ? null : addNoteBtn);
        if (target) target.focus({ preventScroll: true });
      }
      lastFocused = null;
    }

    function setupModalKeyboardSync() {
      if (!window.visualViewport) return;

      const onViewportChange = () => {
        if (!noteModal.classList.contains('active')) return;
        const vv = window.visualViewport;
        modalContent.style.maxHeight = `${Math.min(vv.height - 32, window.innerHeight * 0.85)}px`;
      };

      window.visualViewport.addEventListener('resize', onViewportChange);
      window.visualViewport.addEventListener('scroll', onViewportChange);
    }

    let searchNotesTimer = null;
    searchNotesInput.addEventListener('input', e => {
      const val = e.target.value;
      cancelAnimationFrame(searchNotesTimer);
      searchNotesTimer = requestAnimationFrame(() => {
        renderNotes(val);
        addNoteBtn.hidden = Boolean(val.trim());
      });
    });

    addNoteBtn.addEventListener('click', () => openNoteModal());
    $('cancel-note').addEventListener('click', closeNoteModal);
    noteModal.addEventListener('click', e => { if (e.target === noteModal) closeNoteModal(); });

    $('note-form').addEventListener('submit', e => {
      e.preventDefault();
      const text = noteTextInput.value.trim();
      if (!text) return;

      const nowObj = new Date();
      const date = nowObj.toISOString();
      const formattedDate = dateFormatter.format(nowObj);
      const norm = normalize(text);

      if (currentNote) {
        const idx = notes.findIndex(n => n.id === currentNote.id);
        const updated = {
          id: currentNote.id,
          text,
          norm,
          date,
          formattedDate
        };
        if (idx !== -1) {
          notes[idx] = updated;
        } else {
          notes.unshift(updated);
        }
      } else {
        notes.unshift({
          id: generateId(),
          text,
          norm,
          date,
          formattedDate
        });
      }

      store.set(KEYS.NOTES, notes.map(n => ({ id: n.id, text: n.text, date: n.date })));
      renderNotes(searchNotesInput.value);
      closeNoteModal();
    });

    // Boot: the script sits at the end of <body>, so the DOM is already parsed
    initApp();
    snapToPanel(1, 0);
    setupAmbientOrbs();
    setupLiquidLens();
  </script>
</body>
</html>
