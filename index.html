<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lanzador</title>
  <!-- Preconecta a Vercel durante los ms de carga para acelerar la redirección -->
  <link rel="preconnect" href="https://super-pearl-iota.vercel.app" crossorigin>
  <style>
    :root {
      --bar-width: 220px;
      --bar-height: 6px;
      --glass-surface: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.16);
      --apple-white: #ffffff;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: #000000;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Cápsula de cristal líquido centrada */
    .loading-bar {
      width: var(--bar-width);
      height: var(--bar-height);
      background: var(--glass-surface);
      border-radius: 9999px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: 
        inset 0 1px 1px rgba(255, 255, 255, 0.35),
        inset 0 -1px 1px rgba(0, 0, 0, 0.7),
        0 4px 16px rgba(0, 0, 0, 0.6),
        0 0 1px rgba(255, 255, 255, 0.2);
    }

    /* Reflejo cáustico dinámico */
    .loading-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.2) 50%,
        transparent 100%
      );
      animation: crystal-shimmer 2.2s infinite ease-in-out;
      pointer-events: none;
      z-index: 2;
    }

    /* Progreso estilo Apple: blanco puro con refracción especular */
    .loading-progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(180deg, #ffffff 0%, #e6e6e6 100%);
      border-radius: inherit;
      position: relative;
      z-index: 1;
      box-shadow: 
        0 0 10px rgba(255, 255, 255, 0.45),
        inset 0 1px 0.5px rgba(255, 255, 255, 0.9);
      transition: width 0.16s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes crystal-shimmer {
      0% {
        transform: translateX(0%);
      }
      100% {
        transform: translateX(250%);
      }
    }
  </style>
</head>
<body>

  <div class="loading-bar">
    <div class="loading-progress" id="loading-progress"></div>
  </div>

  <script>
    'use strict';

    const progressEl = document.getElementById('loading-progress');
    let progress = 0;

    const advance = () => {
      const step = progress < 60 
        ? Math.random() * 9 + 4 
        : Math.random() * 18 + 12;

      progress = Math.min(progress + step, 100);
      progressEl.style.width = `${progress}%`;

      if (progress >= 100) {
        setTimeout(() => {
          window.location.replace('https://super-pearl-iota.vercel.app/');
        }, 160);
        return;
      }

      setTimeout(advance, Math.random() * 40 + 25);
    };

    advance();
  </script>
</body>
</html>
