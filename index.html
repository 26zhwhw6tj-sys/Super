<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Notas Rediseñado</title>
  <style>
    :root {
      --primary: #4361ee;
      --primary-light: #4895ef;
      --primary-dark: #3f37c9;
      --secondary: #4cc9f0;
      --background: #f8f9fa;
      --surface: #ffffff;
      --surface-variant: #f1f3f5;
      --text-primary: #212529;
      --text-secondary: #6c757d;
      --text-hint: #adb5bd;
      --border: #e9ecef;
      --success: #4caf50;
      --warning: #ff9800;
      --error: #f44336;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      --shadow-hover: 0 6px 16px rgba(0, 0, 0, 0.12);
      --radius: 12px;
      --radius-sm: 8px;
      --transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
    }

    .app-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      width: 100%;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .app-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-title svg {
      width: 32px;
      height: 32px;
      fill: var(--primary);
    }

    .search-container {
      position: relative;
      max-width: 400px;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 14px 20px 14px 48px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background-color: var(--surface);
      font-size: 16px;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-hint);
      width: 20px;
      height: 20px;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 16px;
    }

    .view-controls {
      display: flex;
      gap: 8px;
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 4px;
      box-shadow: var(--shadow);
    }

    .view-btn {
      background: none;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      color: var(--text-secondary);
      transition: var(--transition);
    }

    .view-btn.active {
      background: var(--primary);
      color: white;
    }

    .add-note-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }

    .add-note-btn:hover {
      background: var(--primary-dark);
      box-shadow: var(--shadow-hover);
    }

    .add-note-btn:active {
      transform: translateY(1px);
    }

    .notes-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .note-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      transition: var(--transition);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      height: 100%;
      border: 1px solid var(--border);
    }

    .note-card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-4px);
      border-color: var(--primary-light);
    }

    .note-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .note-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--primary-dark);
      margin: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
    }

    .note-actions {
      display: flex;
      gap: 8px;
      opacity: 0;
      transition: var(--transition);
    }

    .note-card:hover .note-actions {
      opacity: 1;
    }

    .note-action-btn {
      background: none;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-hint);
      transition: var(--transition);
    }

    .note-action-btn:hover {
      background: var(--surface-variant);
      color: var(--text-primary);
    }

    .note-content {
      color: var(--text-secondary);
      margin-bottom: 16px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
    }

    .note-date {
      font-size: 13px;
      color: var(--text-hint);
      text-align: right;
      margin-top: auto;
    }

    .empty-state {
      text-align: center;
      padding: 64px 24px;
      grid-column: 1 / -1;
    }

    .empty-state-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      color: var(--text-hint);
    }

    .empty-state-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .empty-state-text {
      color: var(--text-secondary);
      max-width: 500px;
      margin: 0 auto 24px;
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
    }

    .modal.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: var(--surface);
      border-radius: var(--radius);
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }

    .modal.active .modal-content {
      transform: translateY(0);
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
    }

    .modal-close {
      background: none;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-hint);
      transition: var(--transition);
    }

    .modal-close:hover {
      background: var(--surface-variant);
      color: var(--text-primary);
    }

    .modal-body {
      padding: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .form-input,
    .form-textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 16px;
      background: var(--surface-variant);
      transition: var(--transition);
    }

    .form-input:focus,
    .form-textarea:focus {
      outline: none;
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
    }

    .form-textarea {
      min-height: 150px;
      resize: vertical;
    }

    .modal-footer {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .btn {
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-size: 15px;
      transition: var(--transition);
    }

    .btn-secondary {
      background: var(--surface-variant);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background: #e2e6ea;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-danger {
      background: var(--error);
      color: white;
    }

    .btn-danger:hover {
      background: #d32f2f;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      color: var(--text-secondary);
      font-size: 14px;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 768px) {
      .app-container {
        padding: 16px;
      }
      
      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
      
      .search-container {
        max-width: 100%;
      }
      
      .controls {
        flex-direction: column;
        align-items: stretch;
      }
      
      .view-controls {
        justify-content: center;
      }
      
      .notes-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <h1 class="app-title">
        <svg viewBox="0 0 24 24">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
        </svg>
        Panel de Notas
      </h1>
      <div class="search-container">
        <svg class="search-icon" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" class="search-input" id="search-notes" placeholder="Buscar notas...">
      </div>
    </header>

    <div class="controls">
      <div class="view-controls">
        <button class="view-btn active">Todas</button>
        <button class="view-btn">Recientes</button>
        <button class="view-btn">Favoritas</button>
      </div>
      <button class="add-note-btn" id="add-note-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/>
        </svg>
        Nueva Nota
      </button>
    </div>

    <div class="notes-container" id="notes-container">
      <!-- Las notas se generarán aquí dinámicamente -->
    </div>

    <div class="stats">
      <span id="notes-count">0 notas</span>
      <span>Última actualización: Hoy</span>
    </div>
  </div>

  <!-- Modal de Notas -->
  <div class="modal" id="note-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Nueva Nota</h2>
        <button class="modal-close" id="modal-close">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="note-form">
          <div class="form-group">
            <label class="form-label" for="note-title">Título</label>
            <input type="text" class="form-input" id="note-title" placeholder="Título de la nota" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="note-content">Contenido</label>
            <textarea class="form-textarea" id="note-content" placeholder="Escribe tu nota aquí..." required></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-cancel">Cancelar</button>
        <button class="btn btn-primary" id="modal-save">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    // Datos de ejemplo para las notas
    let notes = [
      {
        id: 1,
        title: "Lista de compras",
        content: "Leche, pan, huevos, frutas, verduras, carne de res, pollo, arroz, pasta, tomates, cebollas, aceite de oliva, queso, yogur",
        date: "2023-05-15T10:30:00Z",
        favorite: false
      },
      {
        id: 2,
        title: "Reunión de trabajo",
        content: "Preparar presentación para el cliente, revisar presupuesto, coordinar con el equipo de diseño, enviar informe semanal",
        date: "2023-05-14T14:15:00Z",
        favorite: true
      },
      {
        id: 3,
        title: "Ideas para el proyecto",
        content: "Diseño minimalista, colores vibrantes, funcionalidad intuitiva, responsive design, animaciones suaves, tipografía legible",
        date: "2023-05-12T09:45:00Z",
        favorite: false
      }
    ];

    let currentNote = null;
    let isEditing = false;

    // Función para formatear la fecha
    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('es-ES', {
        day: '2-digit',
        month: 'short',
        year: 'numeric'
      });
    }

    // Función para escapar HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Función para renderizar las notas
    function renderNotes(query = "") {
      const filtered = query
        ? notes.filter(note => 
            note.title.toLowerCase().includes(query.toLowerCase()) || 
            note.content.toLowerCase().includes(query.toLowerCase())
          )
        : notes;

      const container = document.getElementById('notes-container');
      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg class="empty-state-icon" viewBox="0 0 24 24">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
            </svg>
            <h3 class="empty-state-title">No hay notas</h3>
            <p class="empty-state-text">Crea tu primera nota usando el botón "Nueva Nota"</p>
            <button class="add-note-btn" id="add-note-empty">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/>
              </svg>
              Crear Nota
            </button>
          </div>
        `;
        document.getElementById('add-note-empty').addEventListener('click', openNoteModal);
      } else {
        filtered.forEach(note => {
          const noteElement = document.createElement('div');
          noteElement.className = 'note-card';
          noteElement.innerHTML = `
            <div class="note-header">
              <h3 class="note-title">${escapeHtml(note.title)}</h3>
              <div class="note-actions">
                <button class="note-action-btn" data-action="edit" data-id="${note.id}" title="Editar">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor"/>
                  </svg>
                </button>
                <button class="note-action-btn" data-action="delete" data-id="${note.id}" title="Eliminar">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="currentColor"/>
                  </svg>
                </button>
              </div>
            </div>
            <div class="note-content">${escapeHtml(note.content)}</div>
            <div class="note-date">${formatDate(note.date)}</div>
          `;
          
          container.appendChild(noteElement);
        });
      }

      // Actualizar contador de notas
      document.getElementById('notes-count').textContent = `${filtered.length} nota${filtered.length !== 1 ? 's' : ''}`;

      // Agregar event listeners a los botones de acción
      document.querySelectorAll('.note-action-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const action = btn.dataset.action;
          const id = parseInt(btn.dataset.id);
          
          if (action === 'edit') {
            const note = notes.find(n => n.id === id);
            openNoteModal(note);
          } else if (action === 'delete') {
            deleteNote(id);
          }
        });
      });

      // Agregar event listeners a las tarjetas de notas
      document.querySelectorAll('.note-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (!e.target.closest('.note-action-btn')) {
            const id = parseInt(card.querySelector('.note-action-btn').dataset.id);
            const note = notes.find(n => n.id === id);
            openNoteModal(note);
          }
        });
      });
    }

    // Función para abrir el modal de notas
    function openNoteModal(note = null) {
      currentNote = note;
      const modal = document.getElementById('note-modal');
      const titleInput = document.getElementById('note-title');
      const contentInput = document.getElementById('note-content');
      const modalTitle = document.getElementById('modal-title');
      
      if (note) {
        modalTitle.textContent = 'Editar Nota';
        titleInput.value = note.title;
        contentInput.value = note.content;
        isEditing = true;
      } else {
        modalTitle.textContent = 'Nueva Nota';
        titleInput.value = '';
        contentInput.value = '';
        isEditing = false;
      }
      
      modal.classList.add('active');
      titleInput.focus();
    }

    // Función para cerrar el modal de notas
    function closeNoteModal() {
      document.getElementById('note-modal').classList.remove('active');
      currentNote = null;
    }

    // Función para guardar una nota
    function saveNote() {
      const title = document.getElementById('note-title').value.trim();
      const content = document.getElementById('note-content').value.trim();
      
      if (title && content) {
        const now = new Date().toISOString();
        
        if (currentNote) {
          // Editar nota existente
          currentNote.title = title;
          currentNote.content = content;
          currentNote.date = now;
        } else {
          // Crear nueva nota
          const newNote = {
            id: Date.now(),
            title,
            content,
            date: now,
            favorite: false
          };
          notes.unshift(newNote); // Agregar al inicio
        }
        
        renderNotes(document.getElementById('search-notes').value);
        closeNoteModal();
      }
    }

    // Función para eliminar una nota
    function deleteNote(id) {
      if (confirm('¿Eliminar esta nota?')) {
        notes = notes.filter(note => note.id !== id);
        renderNotes(document.getElementById('search-notes').value);
      }
    }

    // Inicialización de la aplicación
    document.addEventListener('DOMContentLoaded', function() {
      // Renderizar notas iniciales
      renderNotes();
      
      // Event listeners
      document.getElementById('add-note-btn').addEventListener('click', openNoteModal);
      
      document.getElementById('search-notes').addEventListener('input', (e) => {
        renderNotes(e.target.value);
      });
      
      document.getElementById('modal-close').addEventListener('click', closeNoteModal);
      document.getElementById('modal-cancel').addEventListener('click', closeNoteModal);
      document.getElementById('modal-save').addEventListener('click', saveNote);
      
      // Cerrar modal al hacer clic fuera
      document.getElementById('note-modal').addEventListener('click', (e) => {
        if (e.target.id === 'note-modal') {
          closeNoteModal();
        }
      });
      
      // Guardar con Enter en el formulario
      document.getElementById('note-form').addEventListener('submit', (e) => {
        e.preventDefault();
        saveNote();
      });
    });
  </script>
</body>
</html>
