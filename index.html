<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>🛒 Súper</title>
  <style>
    :root {
      --accent: #00ff88;
      --bg: #000;
      --surface: #111;
      --text-main: #fff;
      --text-muted: #aaa;
      --border: #333;
      --danger: #ff453a;
      --radius: 16px;
      --note-bg: #1a1a1a;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, textarea {
      user-select: auto;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      height: 100dvh;
      position: fixed;
      width: 100%;
    }

    .launcher {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.4s ease;
    }

    .launcher.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-bar {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-progress {
      height: 100%;
      width: 0%;
      background: #fff;
      transition: width 0.1s linear;
    }

    .app-container {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .app-container.visible {
      opacity: 1;
    }

    .panels-container {
      display: flex;
      width: 300vw;
      height: 100dvh;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    .panel {
      width: 100vw;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top, 20px) + 20px) 20px calc(env(safe-area-inset-bottom, 20px) + 20px);
    }

    .panel-header {
      margin-bottom: 16px;
    }

    .panel-title {
      font-size: 24px;
      font-weight: bold;
    }

    .search-container {
      position: relative;
      margin-bottom: 16px;
    }

    .search-input {
      width: 100%;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-main);
      font-size: 16px;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .add-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: bold;
      font-size: 12px;
      display: none;
    }

    #add-note-btn {
      display: block;
    }

    .scroll-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .scroll-area {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .scroll-area::-webkit-scrollbar {
      display: none;
    }

    .fade-overlay {
      position: absolute;
      left: 0;
      width: 100%;
      height: 24px;
      z-index: 10;
      pointer-events: none;
    }

    .top-fade {
      top: 0;
      background: linear-gradient(to bottom, #000, transparent);
    }

    .bottom-fade {
      bottom: 0;
      background: linear-gradient(to top, #000, transparent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 10px;
      padding: 10px 4px;
    }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      transition: background 0.15s, color 0.15s;
    }

    .product-card:active {
      background: rgba(0, 255, 136, 0.2);
      color: var(--accent);
    }

    .cart-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px 4px;
    }

    .cart-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .cart-item:active {
      border-color: var(--accent);
    }

    .item-info {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .item-name {
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-qty {
      font-size: 13px;
      color: var(--text-muted);
      background: var(--bg);
      padding: 2px 8px;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .delete-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--danger);
      border-radius: 10px;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .delete-btn:active {
      background: rgba(255, 69, 58, 0.15);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 60px 20px;
      grid-column: 1 / -1;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state-text {
      font-size: 15px;
      line-height: 1.5;
    }

    .list-footer {
      padding-top: 12px;
      display: none;
      justify-content: flex-end;
      align-items: center;
    }

    .clear-all {
      color: var(--danger);
      background: none;
      border: none;
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .clear-all:active {
      background: rgba(255, 69, 58, 0.15);
    }

    /* Notas modulares y autoajustables */
    .notes-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 10px 4px;
    }

    .note-card {
      background: var(--note-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      position: relative;
      display: flex;
      flex-direction: column;
      height: auto;
    }

    .note-card:active {
      background: rgba(0, 255, 136, 0.08);
      border-color: var(--accent);
    }

    .note-body {
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-main);
      white-space: pre-wrap;
      word-break: break-word;
      padding-right: 34px;
    }

    .note-body::first-line {
      font-size: 16px;
      font-weight: bold;
      color: var(--accent);
    }

    .note-date {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 10px;
      text-align: right;
    }

    .delete-note {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 69, 58, 0.2);
      color: var(--danger);
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .delete-note:active {
      background: rgba(255, 69, 58, 0.4);
    }

    /* Modal de nota unificado con scroll para textos largos */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      padding: 20px;
    }

    .modal.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-height: 85dvh;
      display: flex;
      flex-direction: column;
      padding: 18px;
      transform: translateY(20px);
      transition: transform 0.25s;
    }

    .modal.active .modal-content {
      transform: translateY(0);
    }

    .note-form {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .unified-note-input {
      width: 100%;
      min-height: 64px;
      max-height: 55dvh;
      padding: 14px;
      margin-bottom: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-main);
      font-family: inherit;
      font-size: 16px;
      line-height: 1.5;
      resize: none;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .unified-note-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn {
      padding: 10px 20px;
      border-radius: var(--radius);
      border: none;
      font-weight: bold;
      font-size: 14px;
    }

    .btn-cancel {
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-save {
      background: var(--accent);
      color: #000;
    }
  </style>
</head>
<body>
  <div class="launcher" id="launcher">
    <div class="loading-bar">
      <div class="loading-progress" id="loading-progress"></div>
    </div>
  </div>

  <div class="app-container" id="app-container">
    <div class="panels-container" id="panels-container">
      <!-- Panel Explorar -->
      <div class="panel">
        <div class="panel-header">
          <h1 class="panel-title">Explorar</h1>
        </div>
        <div class="search-container">
          <input type="text" class="search-input" id="search" placeholder="Buscar...">
          <button class="add-btn" id="add-btn">AÑADIR</button>
        </div>
        <div class="scroll-container">
          <div class="fade-overlay top-fade"></div>
          <div class="scroll-area">
            <div class="grid" id="products-grid"></div>
          </div>
          <div class="fade-overlay bottom-fade"></div>
        </div>
      </div>

      <!-- Panel Lista -->
      <div class="panel">
        <div class="panel-header">
          <h1 class="panel-title">Lista</h1>
        </div>
        <div class="scroll-container">
          <div class="fade-overlay top-fade"></div>
          <div class="scroll-area">
            <div class="cart-list" id="cart-list"></div>
          </div>
          <div class="fade-overlay bottom-fade"></div>
        </div>
        <div class="list-footer" id="list-footer">
          <button class="clear-all" id="clear-all">Vaciar</button>
        </div>
      </div>

      <!-- Panel Notas -->
      <div class="panel">
        <div class="panel-header">
          <h1 class="panel-title">Notas</h1>
        </div>
        <div class="search-container">
          <input type="text" class="search-input" id="search-notes" placeholder="Buscar notas...">
          <button class="add-btn" id="add-note-btn">NUEVA NOTA</button>
        </div>
        <div class="scroll-container">
          <div class="fade-overlay top-fade"></div>
          <div class="scroll-area">
            <div class="notes-grid" id="notes-grid"></div>
          </div>
          <div class="fade-overlay bottom-fade"></div>
        </div>
      </div>
    </div>

    <!-- Modal Nota Unificada -->
    <div class="modal" id="note-modal">
      <div class="modal-content">
        <form class="note-form" id="note-form">
          <textarea
            id="note-text"
            class="unified-note-input"
            placeholder="Escribe tu nota aquí..."
            rows="1"
            required
          ></textarea>
          <div class="modal-actions">
            <button type="button" class="btn btn-cancel" id="cancel-note">Cancelar</button>
            <button type="submit" class="btn btn-save">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>

      CART: 'superapp_cart',
      NOTES: 'superapp_notes'
    };

    const defaultProducts = [

Huevos frescos 24 uds", "Huevos pack 24", "Jamón cocido P2", "Jamón cocido sándwich", "Jamón de pavo", "Jamón serrano", "Jamón serrano reserva", "Jamón serrano sobre", "Judías verdes", "Ketchup", "Leave-in Curl Perfec", "Leche condensada entera", "Leche de coco", "Leche en polvo desnatada", "Leche entera", "Leche evaporada", "Leche fresca entera", "Leche fresca semi", "Leche semi", "Lenteja pardina", "Lentejas riojana", "Levadura Royal", "Lima bandeja", "Limbiador con oxígeno", "Limones", "Lombarda", "Lomo adobado", "Lomo embuchado", "Longaniza fresca", "Macarrón rayado", "Macedonia verduras", "Mahonesa", "Mango", "Mantequilla past sin", "Manzana acidulce Fuji", "Manzana roja 1kg", "Masa empanad argent", "Medallón cadera año", "Mega rollo papel", "Mejillones escabeche", "Melocotón en mitades", "Mermelada 75% fruta Confitura", "Mezcla 4 quesos", "Miel stars", "Mini biscotes normal", "Minibombon nocciola", "Mix de frutos secos", "Mollete pack 4", "Molletes", "Mortadela Bolonia", "Mousse choco 1+1", "Mozzarella", "Mozzarella rallada", "Muesli crujiente chocolate", "Muesli fruta", "Nata para cocinar", "Natillas con galleta x4", "Natillas preparar", "Nesquick", "Omega-3 cápsulas", "Orégano", "Pack Cola Zero", "Pan blanco", "Pan bocadillo", "Pan de molde", "Pan de molde blanco", "Pan de pipas", "Pan rallado 400gr", "Pan rústico", "Panecillo 11 uds", "Papel aluminio", "Papel higiénico", "Papel higiénico húmedo", "Pasta de dientes", "Pastilla cisterna", "Patata 5 kg", "Patatas crujientes", "Patatas fritas", "Patatas gajo", "Patatas gourmet", "Paté de atún", "Paté suave", "Pechuga entera", "Pechuga marinada", "Penne rigate", "Pepinillos anchoa", "Perejil", "Picada de vacuno 99%", "Picos camperos", "Pimienta", "Pimentón dulce", "Pimiento destapa 35", "Pimiento rojo", "Pimiento tricolor", "Pimiento verde freír", "Piña en rodajas", "Pipas gigantes", "Piquillo entero", "Piquillo tiras con ajo", "Pistachos California", "Pizza pepperoni", "Pollo certificado", "Pollo entero", "Porciones 85% cacao", "Preparado para cocido", "Puerros", "Pure de patatas", "Queso Burgos", "Queso Burgos natural", "Queso DO Idiazabal", "Queso Gouda añejo DOP", "Queso cottage", "Queso lonchas", "Queso rallado pizza", "Queso untar suave", "Ramo de rosas", "Rebuenas", "Rodaja potón cocido", "Roja dulce bolsa", "Rosca jamón y queso", "Sal yodada fina", "Salchichas Bockwurst", "Salchichon", "Salmorejo fresco", "Salmón al natural", "Salsa de soja", "Salsa ligera", "Salsa para pasta", "Salsas italianas", "Sardinillas", "Sazonador burrito", "Solomillo", "Special fuets stick", "Special queso inglés", "Special queso St Nect", "Special surtido bloc foie", "Suavizante premium", "Tacos contramuslo ajillo", "Tagliatelle", "Tinta de sepia", "Toall bebe fresc 80", "Toallitas quitagrasa", "Tocino cielo", "Tomate Sweet", "Tomate azul", "Tomate frito artesán", "Tomate negro", "Tomate receta artesana", "Tomate rosa", "Tomate triturado", "Tónica", "Tónica Hibiscus", "Tónica Pink", "Tortas de aceite", "Tostaditas surtidas", "Tostas centeno integral", "Yogur bolitas", "Zamburiñas en salsa", "Zanahoria bolsa", "Zanahorias"
    ];

    const $ = id => document.getElementById(id);
    const panelsContainer = $('panels-container');
    const searchInput = $('search');
    const addBtn = $('add-btn');
    const searchNotesInput = $('search-notes');
    const addNoteBtn = $('add-note-btn');
    const noteModal = $('note-modal');
    const noteTextInput = $('note-text');

    let products = [];
    let cartItems = [];
    let notes = [];
    let currentPanel = 1;
    let currentNote = null;

    const getStore = (key) => {
      try {
        return JSON.parse(localStorage.getItem(key)) || [];
      } catch {
        return [];
      }
    };

    const setStore = (key, data) => {
      try {
        localStorage.setItem(key, JSON.stringify(data));
      } catch (e) {
        console.error(e);
      }
    };

    const escapeHtml = (text) => {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    };

    // Autoajuste dinámico que mantiene la posición del scroll en notas largas
    function autoResizeTextarea() {
      const prevScroll = noteTextInput.scrollTop;
      noteTextInput.style.height = 'auto';
      noteTextInput.style.height = noteTextInput.scrollHeight + 'px';
      noteTextInput.scrollTop = prevScroll;
    }

    noteTextInput.addEventListener('input', autoResizeTextarea);

    document.addEventListener('DOMContentLoaded', () => {
      const loadingProgress = $('loading-progress');
      let progress = 0;

      function updateProgress() {
        progress += Math.random() * 8 + 2;
        if (progress >= 100) {
          loadingProgress.style.width = '100%';
          setTimeout(() => {
            $('launcher').classList.add('hidden');
            $('app-container').classList.add('visible');
            panelsContainer.style.transform = 'translateX(-100vw)';
            initApp();
          }, 250);
          return;
        }
        loadingProgress.style.width = `${progress}%`;
        requestAnimationFrame(updateProgress);
      }
      requestAnimationFrame(updateProgress);
    });

    function initApp() {
      products = getStore(KEYS.PRODUCTS);
      if (!products.length) {
        products = defaultProducts.map(name => ({ name }));
        setStore(KEYS.PRODUCTS, products);
      }
      cartItems = getStore(KEYS.CART);

      notes = getStore(KEYS.NOTES).map(n => ({
        id: n.id,
        text: n.text ?? [n.title, n.content].filter(Boolean).join('\n'),
        date: n.date
      }));

      renderProducts();
      renderCart();
      renderNotes();
      setupTouchSwipe();
    }

    function setupTouchSwipe() {
      let startX = 0;
      let startY = 0;
      let currentX = 0;
      let isDragging = false;
      let isHorizontal = null;

      panelsContainer.addEventListener('touchstart', (e) => {
        if (noteModal.classList.contains('active')) return;
        startX = currentX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        isDragging = true;
        isHorizontal = null;
        panelsContainer.style.transition = 'none';
      }, { passive: true });

      panelsContainer.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const x = e.touches[0].clientX;
        const y = e.touches[0].clientY;
        const diffX = x - startX;
        const diffY = y - startY;

        if (isHorizontal === null) {
          if (Math.abs(diffX) > 10 || Math.abs(diffY) > 10) {
            isHorizontal = Math.abs(diffX) > Math.abs(diffY);
          }
        }

        if (!isHorizontal) return;
        currentX = x;

        if ((currentPanel === 0 && diffX > 0) || (currentPanel === 2 && diffX < 0)) {
          return;
        }

        const translateX = -currentPanel * 100 + (diffX / window.innerWidth) * 100;
        panelsContainer.style.transform = `translateX(${translateX}vw)`;
      }, { passive: true });

      panelsContainer.addEventListener('touchend', () => {
        if (!isDragging) return;
        isDragging = false;
        panelsContainer.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';

        if (isHorizontal) {
          const diffX = currentX - startX;
          const threshold = window.innerWidth / 4;
          if (diffX > threshold && currentPanel > 0) currentPanel--;
          else if (diffX < -threshold && currentPanel < 2) currentPanel++;
        }

        panelsContainer.style.transform = `translateX(-${currentPanel * 100}vw)`;
      });
    }

    // Productos
    function renderProducts(query = "") {
      const q = query.toLowerCase();
      const filtered = q ? products.filter(p => p.name.toLowerCase().includes(q)) : products;
      const grid = $('products-grid');

      if (!filtered.length) {
        grid.innerHTML = '<div class="empty-state">No hay productos</div>';
        return;
      }

      grid.innerHTML = filtered
        .map(p => `<div class="product-card" data-name="${escapeHtml(p.name)}">${escapeHtml(p.name)}</div>`)
        .join('');
    }

    $('products-grid').addEventListener('click', (e) => {
      const card = e.target.closest('.product-card');
      if (!card) return;
      const name = card.dataset.name;
      const existing = cartItems.find(item => item.name === name);
      if (existing) {
        existing.qty++;
      } else {
        cartItems.push({ id: Date.now(), name, qty: 1 });
      }
      setStore(KEYS.CART, cartItems);
      renderCart();
    });

    searchInput.addEventListener('input', (e) => {
      const val = e.target.value.trim();
      renderProducts(val);
      const exists = products.some(p => p.name.toLowerCase() === val.toLowerCase());
      addBtn.style.display = val && !exists ? 'block' : 'none';
    });

    addBtn.addEventListener('click', () => {
      const name = searchInput.value.trim();
      if (!name) return;
      products.push({ name });
      setStore(KEYS.PRODUCTS, products);
      searchInput.value = '';
      addBtn.style.display = 'none';
      renderProducts();
    });

    // Lista de compra
    function renderCart() {
      const list = $('cart-list');
      const footer = $('list-footer');

      if (!cartItems.length) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🛒</div>
            <p class="empty-state-text">Tu lista está vacía.<br>Añade productos desde <strong>Explorar</strong>.</p>
          </div>`;
        footer.style.display = 'none';
        return;
      }

      footer.style.display = 'flex';
      const sorted = [...cartItems].sort((a, b) => a.name.localeCompare(b.name));

      list.innerHTML = sorted.map((item, idx) => {
        if (!item.id) item.id = Date.now() + idx;
        return `
          <div class="cart-item">
            <div class="item-info">
              <span class="item-name">${escapeHtml(item.name)}</span>
              <span class="item-qty">×${item.qty}</span>
            </div>
            <button class="delete-btn" data-id="${item.id}" aria-label="Eliminar">×</button>
          </div>`;
      }).join('');
    }

    $('cart-list').addEventListener('click', (e) => {
      const btn = e.target.closest('.delete-btn');
      if (!btn) return;
      const id = Number(btn.dataset.id);
      cartItems = cartItems.filter(i => i.id !== id);
      setStore(KEYS.CART, cartItems);
      renderCart();
    });

    $('clear-all').addEventListener('click', () => {
      if (cartItems.length && confirm('¿Vaciar toda la lista?')) {
        cartItems = [];
        setStore(KEYS.CART, cartItems);
        renderCart();
      }
    });

    // Notas unificadas
    function renderNotes(query = "") {
      const q = query.toLowerCase();
      const filtered = q
        ? notes.filter(n => n.text.toLowerCase().includes(q))
        : notes;
      const grid = $('notes-grid');

      if (!filtered.length) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📝</div>
            <p class="empty-state-text">No hay notas.<br>¡Crea tu primera nota!</p>
          </div>`;
        return;
      }

      grid.innerHTML = filtered.map(note => {
        const dateStr = new Date(note.date).toLocaleDateString('es-ES', {
          day: '2-digit', month: 'short', year: 'numeric'
        });
        return `
          <div class="note-card" data-id="${note.id}">
            <button class="delete-note" data-delete-id="${note.id}" aria-label="Eliminar">×</button>
            <div class="note-body">${escapeHtml(note.text)}</div>
            <div class="note-date">${dateStr}</div>
          </div>`;
      }).join('');
    }

    $('notes-grid').addEventListener('click', (e) => {
      const delBtn = e.target.closest('.delete-note');
      if (delBtn) {
        const id = Number(delBtn.dataset.deleteId);
        if (confirm('¿Eliminar esta nota?')) {
          notes = notes.filter(n => n.id !== id);
          setStore(KEYS.NOTES, notes);
          renderNotes(searchNotesInput.value);
        }
        return;
      }

      const card = e.target.closest('.note-card');
      if (card) {
        const note = notes.find(n => n.id === Number(card.dataset.id));
        if (note) openNoteModal(note);
      }
    });

    function openNoteModal(note = null) {
      currentNote = note;
      noteTextInput.value = note ? note.text : '';
      noteModal.classList.add('active');
      requestAnimationFrame(() => {
        autoResizeTextarea();
        noteTextInput.scrollTop = 0;
        noteTextInput.focus();
      });
    }

    function closeNoteModal() {
      noteModal.classList.remove('active');
      noteTextInput.blur();
      currentNote = null;
    }

    searchNotesInput.addEventListener('input', (e) => {
      const val = e.target.value;
      renderNotes(val);
      addNoteBtn.style.display = val ? 'none' : 'block';
    });

    addNoteBtn.addEventListener('click', () => openNoteModal());
    $('cancel-note').addEventListener('click', closeNoteModal);

    noteModal.addEventListener('click', (e) => {
      if (e.target === noteModal) closeNoteModal();
    });

    $('note-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = noteTextInput.value.trim();
      if (!text) return;

      const date = new Date().toISOString();
      if (currentNote) {
        currentNote.text = text;
        currentNote.date = date;
      } else {
        notes.push({ id: Date.now(), text, date });
      }

      setStore(KEYS.NOTES, notes);
      renderNotes(searchNotesInput.value);
      closeNoteModal();
    });
  </script>
</body>
</html>
