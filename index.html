<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>🛒 Súper</title>
  <style>
    :root {
      --accent: #00ff88;
      --bg: #000;
      --surface: #111;
      --text: #fff;
      --muted: #aaa;
      --border: #333;
      --danger: #ff453a;
      --radius: 16px;
      --note-bg: #1a1a1a;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, textarea {
      user-select: auto;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
    }

    .launcher {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.3s ease;
    }

    .launcher.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-bar {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
    }

    .loading-progress {
      height: 100%;
      width: 0%;
      background: #fff;
      transition: width 0.1s linear;
    }

    .app-container {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .app-container.visible {
      opacity: 1;
    }

    .panels-container {
      display: flex;
      width: 300vw;
      height: 100vh;
      height: 100dvh;
      will-change: transform;
      backface-visibility: hidden;
      transform: translate3d(-100vw, 0, 0);
    }

    .panels-container.is-swiping {
      pointer-events: none;
    }

    .panel {
      width: 100vw;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 16px);
      contain: layout paint;
    }

    .panel-header {
      margin-bottom: 14px;
    }

    .panel-title {
      font-size: 24px;
      font-weight: 700;
    }

    .search-container {
      position: relative;
      margin-bottom: 14px;
    }

    .search-input {
      width: 100%;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .add-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 12px;
      display: none;
      cursor: pointer;
    }

    #add-note-btn {
      display: block;
    }

    .scroll-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      contain: content;
    }

    .scroll-area {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      overscroll-behavior: contain;
    }

    .scroll-area::-webkit-scrollbar {
      display: none;
    }

    .fade-overlay {
      position: absolute;
      left: 0;
      width: 100%;
      height: 24px;
      z-index: 10;
      pointer-events: none;
    }

    .top-fade {
      top: 0;
      background: linear-gradient(to bottom, var(--bg), transparent);
    }

    .bottom-fade {
      bottom: 0;
      background: linear-gradient(to top, var(--bg), transparent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      gap: 10px;
      padding: 8px 2px;
    }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      contain: layout style paint;
      transition: background 0.15s, color 0.15s;
    }

    .product-card:active {
      background: rgba(0, 255, 136, 0.2);
      color: var(--accent);
    }

    .cart-list, .notes-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 8px 2px;
    }

    .cart-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      contain: layout style paint;
    }

    .cart-item:active {
      border-color: var(--accent);
    }

    .item-info {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .item-name {
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-qty {
      font-size: 12px;
      color: var(--muted);
      background: var(--bg);
      padding: 2px 8px;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .delete-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--danger);
      border-radius: 10px;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .delete-btn:active {
      background: rgba(255, 69, 58, 0.15);
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
      grid-column: 1 / -1;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 14px;
      opacity: 0.5;
    }

    .empty-state-text {
      font-size: 14px;
      line-height: 1.5;
    }

    .list-footer {
      padding-top: 10px;
      display: none;
      justify-content: flex-end;
    }

    .clear-all {
      color: var(--danger);
      background: none;
      border: none;
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .clear-all:active {
      background: rgba(255, 69, 58, 0.15);
    }

    .note-card {
      background: var(--note-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      position: relative;
      contain: layout style paint;
    }

    .note-card:active {
      background: rgba(0, 255, 136, 0.08);
      border-color: var(--accent);
    }

    .note-body {
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      padding-right: 32px;
    }

    .note-body::first-line {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
    }

    .note-date {
      font-size: 11px;
      color: var(--muted);
      margin-top: 10px;
      text-align: right;
    }

    .delete-note {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 69, 58, 0.2);
      color: var(--danger);
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
    }

    .delete-note:active {
      background: rgba(255, 69, 58, 0.4);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 20px;
    }

    .modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-height: 85vh;
      max-height: 85dvh;
      display: flex;
      flex-direction: column;
      padding: 18px;
      transform: translateY(20px);
      transition: transform 0.2s ease;
    }

    .modal.active .modal-content {
      transform: translateY(0);
    }

    .note-form {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .unified-note-input {
      width: 100%;
      min-height: 70px;
      max-height: 50vh;
      max-height: 50dvh;
      padding: 14px;
      margin-bottom: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font: inherit;
      font-size: 16px;
      line-height: 1.5;
      resize: none;
      overflow-y: auto;
      outline: none;
      field-sizing: content;
      overscroll-behavior: contain;
    }

    .unified-note-input:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn {
      padding: 10px 18px;
      border-radius: var(--radius);
      border: none;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-cancel {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-save {
      background: var(--accent);
      color: #000;
    }
  </style>
</head>
<body>
  <div class="launcher" id="launcher">
    <div class="loading-bar">
      <div class="loading-progress" id="loading-progress"></div>
    </div>
  </div>

  <div class="app-container" id="app-container">
    <div class="panels-container" id="panels-container">
      <div class="panel">
        <div class="panel-header">
          <h1 class="panel-title">Explorar</h1>
        </div>
        <div class="search-container">
          <input type="text" class="search-input" id="search" placeholder="Buscar..." autocomplete="off">
          <button type="button" class="add-btn" id="add-btn">AÑADIR</button>
        </div>
        <div class="scroll-container">
          <div class="fade-overlay top-fade"></div>
          <div class="scroll-area">
            <div class="grid" id="products-grid"></div>
          </div>
          <div class="fade-overlay bottom-fade"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h1 class="panel-title">Lista</h1>
        </div>
        <div class="scroll-container">
          <div class="fade-overlay top-fade"></div>
          <div class="scroll-area">
            <div class="cart-list" id="cart-list"></div>
          </div>
          <div class="fade-overlay bottom-fade"></div>
        </div>
        <div class="list-footer" id="list-footer">
          <button type="button" class="clear-all" id="clear-all">Vaciar</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h1 class="panel-title">Notas</h1>
        </div>
        <div class="search-container">
          <input type="text" class="search-input" id="search-notes" placeholder="Buscar notas..." autocomplete="off">
          <button type="button" class="add-btn" id="add-note-btn">NUEVA NOTA</button>
        </div>
        <div class="scroll-container">
          <div class="fade-overlay top-fade"></div>
          <div class="scroll-area">
            <div class="notes-grid" id="notes-grid"></div>
          </div>
          <div class="fade-overlay bottom-fade"></div>
        </div>
      </div>
    </div>

    <div class="modal" id="note-modal" role="dialog" aria-modal="true">
      <div class="modal-content">
        <form class="note-form" id="note-form">
          <textarea id="note-text" class="unified-note-input" placeholder="Escribe tu nota aquí..." rows="2" required></textarea>
          <div class="modal-actions">
            <button type="button" class="btn btn-cancel" id="cancel-note">Cancelar</button>
            <button type="submit" class="btn btn-save">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const KEYS = { PRODUCTS: 'superapp_products', CART: 'superapp_cart', NOTES: 'superapp_notes' };

    const defaultProducts = [
      "Aceite de girasol", "Aceite de oliva 0.4", "Aceitunas aliñadas", "Aceitunas verdes", "Agua mineral natural", "Aguadoy 8L", "Ajo en polvo", "Ajo morado", "Ajo troceado", "Alas partidas", "Alubia pinta", "Alubia roja", "Anacardos fritos", "Anchoa Cantábrico", "Arroz largo", "Atún aceite girasol", "Atún aceite oliva", "Atún pack 6 girasol", "Azúcar", "Bacon cocido ahumado", "Bacon en tiras", "Batido de chocolate", "Bebida de coco", "Bolsa malla", "Bolsa rafia", "Bolsas cierre fácil x40", "Boniato", "Buitoni obleas", "Burger con sésamo", "Burger de vacuno 1000g", "Burrata", "Caballa aceite oliva", "Cabecero de lomo", "Cabeza de lomo", "Calabacín", "Calamares", "Calamares tinta", "Caldo de carne", "Caldo de cocido", "Caldo de pescado", "Caldo de pollo", "Caldo de verduras", "Café", "Callos", "Canónigos", "Cebolla 1 kg", "Cebolla 2 kg", "Cebolla en polvo", "Cebolla roja", "Centro jamón", "Centro paleta ibérica", "Champiñón Portobello", "Champiñón blanco", "Champiñones laminados", "Champú Curl Perfect", "Champú Repair Nutrit", "Chicles sin azúcar", "Cola Zero 0,5L", "Cola Zero lata", "Colgate anticaries", "Coliflor", "Compresas", "Conos", "Cookies chocolate", "Copa choco y nata", "Copos avena suave", "Crunchy choc", "Curry", "Cuña viejo tostado", "Decoración pasteles", "Descafeinado", "Desmaquillante micelar oil", "Detergente color", "Digestive Choco", "Discos desmaquilares", "Dulce de leche", "Emmental", "Emmental rallado", "Ensalada Duo", "Entraña", "Estofado de vacuno", "Fabada asturiana", "Fideo fino nº 0", "Filete pavo tierno", "Filetes cabeza lomo", "Flan caramelo preparado", "Flash", "Flor pascua grande", "Fresón 500g", "Friegasuelos pétalos", "Fte merluza empanado", "G Pedrosillano", "Gall c chocoblanco", "Galleta rellena", "Galletas", "Gel argán", "Gel lavavajillas", "Griego azúcar caña", "Griego natural", "Guisante con zanahoria", "Guisantes", "Hamburguesa Frisona", "Harina de trigo", "Havarti", "Helado Mini Mix", "Huevos 12M", "Huevos M gallinas suelo", "Huevos frescos 24 uds", "Huevos pack 24", "Jamón cocido P2", "Jamón cocido sándwich", "Jamón de pavo", "Jamón serrano", "Jamón serrano reserva", "Jamón serrano sobre", "Judías verdes", "Ketchup", "Leave-in Curl Perfec", "Leche condensada entera", "Leche de coco", "Leche en polvo desnatada", "Leche entera", "Leche evaporada", "Leche fresca entera", "Leche fresca semi", "Leche semi", "Lenteja pardina", "Lentejas riojana", "Levadura Royal", "Lima bandeja", "Limbiador con oxígeno", "Limones", "Lombarda", "Lomo adobado", "Lomo embuchado", "Longaniza fresca", "Macarrón rayado", "Macedonia verduras", "Mahonesa", "Mango", "Mantequilla past sin", "Manzana acidulce Fuji", "Manzana roja 1kg", "Masa empanad argent", "Medallón cadera año", "Mega rollo papel", "Mejillones escabeche", "Melocotón en mitades", "Mermelada 75% fruta Confitura", "Mezcla 4 quesos", "Miel stars", "Mini biscotes normal", "Minibombon nocciola", "Mix de frutos secos", "Mollete pack 4", "Molletes", "Mortadela Bolonia", "Mousse choco 1+1", "Mozzarella", "Mozzarella rallada", "Muesli crujiente chocolate", "Muesli fruta", "Nata para cocinar", "Natillas con galleta x4", "Natillas preparar", "Nesquick", "Omega-3 cápsulas", "Orégano", "Pack Cola Zero", "Pan blanco", "Pan bocadillo", "Pan de molde", "Pan de molde blanco", "Pan de pipas", "Pan rallado 400gr", "Pan rústico", "Panecillo 11 uds", "Papel aluminio", "Papel higiénico", "Papel higiénico húmedo", "Pasta de dientes", "Pastilla cisterna", "Patata 5 kg", "Patatas crujientes", "Patatas fritas", "Patatas gajo", "Patatas gourmet", "Paté de atún", "Paté suave", "Pechuga entera", "Pechuga marinada", "Penne rigate", "Pepinillos anchoa", "Perejil", "Picada de vacuno 99%", "Picos camperos", "Pimienta", "Pimentón dulce", "Pimiento destapa 35", "Pimiento rojo", "Pimiento tricolor", "Pimiento verde freír", "Piña en rodajas", "Pipas gigantes", "Piquillo entero", "Piquillo tiras con ajo", "Pistachos California", "Pizza pepperoni", "Pollo certificado", "Pollo entero", "Porciones 85% cacao", "Preparado para cocido", "Puerros", "Pure de patatas", "Queso Burgos", "Queso Burgos natural", "Queso DO Idiazabal", "Queso Gouda añejo DOP", "Queso cottage", "Queso lonchas", "Queso rallado pizza", "Queso untar suave", "Ramo de rosas", "Rebuenas", "Rodaja potón cocido", "Roja dulce bolsa", "Rosca jamón y queso", "Sal yodada fina", "Salchichas Bockwurst", "Salchichon", "Salmorejo fresco", "Salmón al natural", "Salsa de soja", "Salsa ligera", "Salsa para pasta", "Salsas italianas", "Sardinillas", "Sazonador burrito", "Solomillo", "Special fuets stick", "Special queso inglés", "Special queso St Nect", "Special surtido bloc foie", "Suavizante premium", "Tacos contramuslo ajillo", "Tagliatelle", "Tinta de sepia", "Toall bebe fresc 80", "Toallitas quitagrasa", "Tocino cielo", "Tomate Sweet", "Tomate azul", "Tomate frito artesán", "Tomate negro", "Tomate receta artesana", "Tomate rosa", "Tomate triturado", "Tónica", "Tónica Hibiscus", "Tónica Pink", "Tortas de aceite", "Tostaditas surtidas", "Tostas centeno integral", "Yogur bolitas", "Zamburiñas en salsa", "Zanahoria bolsa", "Zanahorias"
    ];

    const $ = id => document.getElementById(id);
    const panelsContainer = $('panels-container');
    const searchInput = $('search');
    const addBtn = $('add-btn');
    const searchNotesInput = $('search-notes');
    const addNoteBtn = $('add-note-btn');
    const noteModal = $('note-modal');
    const noteTextInput = $('note-text');
    const productsGrid = $('products-grid');
    const cartList = $('cart-list');
    const notesGrid = $('notes-grid');

    let products = [];
    let cartItems = [];
    let notes = [];
    let currentPanel = 1;
    let currentNote = null;
    let uniqueCounter = 0;
    let currentContainerX = 0;
    let suppressClicksUntil = 0;

    const generateId = () => Date.now() + (++uniqueCounter);

    const store = {
      get: k => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } },
      set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
    };

    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const dateFormatter = new Intl.DateTimeFormat('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });

    function autoResizeTextarea() {
      if (CSS.supports?.('field-sizing', 'content')) return;
      noteTextInput.style.height = 'auto';
      noteTextInput.style.height = `${noteTextInput.scrollHeight}px`;
    }

    noteTextInput.addEventListener('input', autoResizeTextarea);

    document.addEventListener('click', e => {
      if (performance.now() < suppressClicksUntil) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    }, true);

    document.addEventListener('DOMContentLoaded', () => {
      initApp();

      const progressEl = $('loading-progress');
      const launcherEl = $('launcher');
      const appContainerEl = $('app-container');
      let progress = 0;

      const loop = () => {
        progress += Math.random() * 12 + 6;
        if (progress >= 100) {
          progressEl.style.width = '100%';
          setTimeout(() => {
            launcherEl.classList.add('hidden');
            appContainerEl.classList.add('visible');
            snapToPanel(1, 0);
            launcherEl.addEventListener('transitionend', () => {
              launcherEl.style.display = 'none';
            }, { once: true });
          }, 120);
          return;
        }
        progressEl.style.width = `${progress}%`;
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    });

    function initApp() {
      const storedProducts = store.get(KEYS.PRODUCTS);
      if (!storedProducts.length) {
        products = defaultProducts.map(name => ({ name, lower: name.toLowerCase() }));
        store.set(KEYS.PRODUCTS, products.map(p => ({ name: p.name })));
      } else {
        products = storedProducts.map(p => ({ name: p.name, lower: p.name.toLowerCase() }));
      }

      cartItems = store.get(KEYS.CART);
      notes = store.get(KEYS.NOTES).map(n => ({
        id: String(n.id || generateId()),
        text: n.text ?? [n.title, n.content].filter(Boolean).join('\n'),
        lower: (n.text ?? [n.title, n.content].filter(Boolean).join('\n')).toLowerCase(),
        date: n.date || new Date().toISOString(),
        formattedDate: dateFormatter.format(new Date(n.date || Date.now()))
      }));

      renderProducts();
      renderCart();
      renderNotes();
      setupTouchSwipe();
      setupModalKeyboardSync();
    }

    function setContainerPosition(offsetPx, durationMs = 0, easing = 'cubic-bezier(0.22, 1, 0.36, 1)') {
      currentContainerX = offsetPx;
      panelsContainer.style.transition = durationMs > 0 ? `transform ${durationMs}ms ${easing}` : 'none';
      panelsContainer.style.transform = `translate3d(${offsetPx}px, 0, 0)`;
    }

    function snapToPanel(index, duration = 240, easing = 'cubic-bezier(0.22, 1, 0.36, 1)') {
      currentPanel = Math.max(0, Math.min(2, index));
      setContainerPosition(-currentPanel * window.innerWidth, duration, easing);
    }

    function setupTouchSwipe() {
      let startX = 0, startY = 0, currentX = 0;
      let isDragging = false;
      let isHorizontal = null;
      let dragBaseOffset = 0;
      let rAf = null;
      let velocitySamples = [];
      let lastWidth = window.innerWidth;

      panelsContainer.addEventListener('touchstart', e => {
        if (noteModal.classList.contains('active') || e.touches.length > 1) return;
        if (e.target.closest('input, textarea')) return;

        const t = e.touches[0];
        startX = currentX = t.clientX;
        startY = t.clientY;
        isDragging = true;
        isHorizontal = null;

        const now = performance.now();
        velocitySamples = [{ x: startX, t: now }];
        dragBaseOffset = currentContainerX;
        setContainerPosition(dragBaseOffset, 0);
      }, { passive: true });

      panelsContainer.addEventListener('touchmove', e => {
        if (!isDragging || e.touches.length > 1) return;

        const t = e.touches[0];
        const dx = t.clientX - startX;
        const dy = t.clientY - startY;

        if (isHorizontal === null && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
          isHorizontal = Math.abs(dx) > Math.abs(dy);
          if (isHorizontal) {
            panelsContainer.classList.add('is-swiping');
          }
        }

        if (!isHorizontal) return;
        currentX = t.clientX;

        const now = performance.now();
        velocitySamples.push({ x: currentX, t: now });
        while (velocitySamples.length > 1 && now - velocitySamples[0].t > 100) {
          velocitySamples.shift();
        }

        const w = window.innerWidth;
        let targetX = dragBaseOffset + dx;

        if (targetX > 0) {
          targetX = targetX * 0.25;
        } else if (targetX < -2 * w) {
          targetX = -2 * w + (targetX - (-2 * w)) * 0.25;
        }

        if (!rAf) {
          rAf = requestAnimationFrame(() => {
            setContainerPosition(targetX, 0);
            rAf = null;
          });
        }
      }, { passive: true });

      const onDragEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        panelsContainer.classList.remove('is-swiping');
        if (rAf) { cancelAnimationFrame(rAf); rAf = null; }

        if (isHorizontal) {
          suppressClicksUntil = performance.now() + 150;
          const w = window.innerWidth;
          let velocity = 0;

          if (velocitySamples.length >= 2) {
            const first = velocitySamples[0];
            const last = velocitySamples[velocitySamples.length - 1];
            const dt = Math.max(1, last.t - first.t);
            velocity = (last.x - first.x) / dt;
          }

          const dx = currentX - startX;
          const absV = Math.abs(velocity);
          const isFlick = absV > 0.25;

          if (isFlick) {
            if (velocity < -0.25 && currentPanel < 2) currentPanel++;
            else if (velocity > 0.25 && currentPanel > 0) currentPanel--;
          } else {
            if (dx < -w * 0.32 && currentPanel < 2) currentPanel++;
            else if (dx > w * 0.32 && currentPanel > 0) currentPanel--;
          }

          const targetX = -currentPanel * w;
          const remainingDistance = Math.abs(targetX - currentContainerX);

          let duration, easing;
          if (absV > 0.35) {
            duration = Math.round(remainingDistance / (absV * 1.35));
            duration = Math.max(130, Math.min(230, duration));
            easing = 'cubic-bezier(0.15, 0.95, 0.3, 1)';
          } else {
            const ratio = Math.min(1, remainingDistance / w);
            duration = Math.round(220 + ratio * 140);
            easing = 'cubic-bezier(0.22, 1, 0.36, 1)';
          }

          setContainerPosition(targetX, duration, easing);
        } else {
          snapToPanel(currentPanel, 200);
        }
      };

      panelsContainer.addEventListener('touchend', onDragEnd);
      panelsContainer.addEventListener('touchcancel', onDragEnd);

      window.addEventListener('resize', () => {
        const w = window.innerWidth;
        if (w !== lastWidth) {
          lastWidth = w;
          snapToPanel(currentPanel, 0);
        }
      }, { passive: true });
    }

    function renderProducts(query = "") {
      const q = query.trim().toLowerCase();
      let html = '';
      let count = 0;
      let exactMatch = false;

      for (let i = 0, l = products.length; i < l; i++) {
        const p = products[i];
        if (p.lower === q) exactMatch = true;
        if (!q || p.lower.includes(q)) {
          count++;
          const n = esc(p.name);
          html += `<div class="product-card" data-name="${n}">${n}</div>`;
        }
      }

      productsGrid.innerHTML = count ? html : '<div class="empty-state">No hay productos</div>';
      addBtn.style.display = (q && !exactMatch) ? 'block' : 'none';
    }

    productsGrid.addEventListener('click', e => {
      const card = e.target.closest('.product-card');
      if (!card) return;
      const name = card.dataset.name;
      const existing = cartItems.find(i => i.name === name);
      if (existing) {
        existing.qty++;
      } else {
        cartItems.push({ id: String(generateId()), name, qty: 1 });
      }
      store.set(KEYS.CART, cartItems);
      renderCart();
    });

    let searchTimer = null;
    searchInput.addEventListener('input', e => {
      const val = e.target.value;
      cancelAnimationFrame(searchTimer);
      searchTimer = requestAnimationFrame(() => renderProducts(val));
    });

    addBtn.addEventListener('click', () => {
      const name = searchInput.value.trim();
      if (!name) return;
      products.push({ name, lower: name.toLowerCase() });
      store.set(KEYS.PRODUCTS, products.map(p => ({ name: p.name })));
      searchInput.value = '';
      addBtn.style.display = 'none';
      renderProducts();
    });

    function renderCart() {
      const footer = $('list-footer');
      if (!cartItems.length) {
        cartList.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🛒</div>
            <p class="empty-state-text">Tu lista está vacía.<br>Añade productos desde <strong>Explorar</strong>.</p>
          </div>`;
        footer.style.display = 'none';
        return;
      }

      footer.style.display = 'flex';
      const sorted = [...cartItems].sort((a, b) => a.name.localeCompare(b.name));
      let html = '';
      for (let i = 0, l = sorted.length; i < l; i++) {
        const item = sorted[i];
        if (!item.id) item.id = String(generateId());
        const id = esc(item.id);
        html += `
          <div class="cart-item">
            <div class="item-info">
              <span class="item-name">${esc(item.name)}</span>
              <span class="item-qty">×${item.qty}</span>
            </div>
            <button type="button" class="delete-btn" data-id="${id}" aria-label="Eliminar">×</button>
          </div>`;
      }
      cartList.innerHTML = html;
    }

    cartList.addEventListener('click', e => {
      const btn = e.target.closest('.delete-btn');
      if (!btn) return;
      const id = btn.dataset.id;
      cartItems = cartItems.filter(i => String(i.id) !== id);
      store.set(KEYS.CART, cartItems);
      renderCart();
    });

    $('clear-all').addEventListener('click', () => {
      if (cartItems.length && confirm('¿Vaciar toda la lista?')) {
        cartItems = [];
        store.set(KEYS.CART, cartItems);
        renderCart();
      }
    });

    function renderNotes(query = "") {
      const q = query.trim().toLowerCase();
      let html = '';
      let count = 0;

      for (let i = 0, l = notes.length; i < l; i++) {
        const note = notes[i];
        if (!q || note.lower.includes(q)) {
          count++;
          const id = esc(note.id);
          html += `
            <div class="note-card" data-id="${id}">
              <button type="button" class="delete-note" data-delete-id="${id}" aria-label="Eliminar">×</button>
              <div class="note-body">${esc(note.text)}</div>
              <div class="note-date">${note.formattedDate}</div>
            </div>`;
        }
      }

      notesGrid.innerHTML = count ? html : `
        <div class="empty-state">
          <div class="empty-state-icon">📝</div>
          <p class="empty-state-text">${q ? 'No se encontraron notas.' : 'No hay notas.<br>¡Crea tu primera nota!'}</p>
        </div>`;
    }

    notesGrid.addEventListener('click', e => {
      const delBtn = e.target.closest('.delete-note');
      if (delBtn) {
        const id = delBtn.dataset.deleteId;
        if (confirm('¿Eliminar esta nota?')) {
          notes = notes.filter(n => n.id !== id);
          store.set(KEYS.NOTES, notes.map(n => ({ id: n.id, text: n.text, date: n.date })));
          renderNotes(searchNotesInput.value);
        }
        return;
      }

      const card = e.target.closest('.note-card');
      if (card) {
        const note = notes.find(n => n.id === card.dataset.id);
        if (note) openNoteModal(note);
      }
    });

    function openNoteModal(note = null) {
      currentNote = note;
      noteTextInput.value = note ? note.text : '';
      noteModal.classList.add('active');
      requestAnimationFrame(() => {
        autoResizeTextarea();
        noteTextInput.scrollTop = 0;
        noteTextInput.focus({ preventScroll: true });
      });
    }

    function closeNoteModal() {
      noteModal.classList.remove('active');
      noteTextInput.blur();
      currentNote = null;
    }

    function setupModalKeyboardSync() {
      if (!window.visualViewport) return;
      const modalContent = noteModal.querySelector('.modal-content');

      const onViewportChange = () => {
        if (!noteModal.classList.contains('active')) return;
        const vv = window.visualViewport;
        const availableHeight = vv.height;
        modalContent.style.maxHeight = `${Math.min(availableHeight - 32, window.innerHeight * 0.85)}px`;
      };

      window.visualViewport.addEventListener('resize', onViewportChange);
      window.visualViewport.addEventListener('scroll', onViewportChange);
    }

    let searchNotesTimer = null;
    searchNotesInput.addEventListener('input', e => {
      const val = e.target.value;
      cancelAnimationFrame(searchNotesTimer);
      searchNotesTimer = requestAnimationFrame(() => {
        renderNotes(val);
        addNoteBtn.style.display = val.trim() ? 'none' : 'block';
      });
    });

    addNoteBtn.addEventListener('click', () => openNoteModal());
    $('cancel-note').addEventListener('click', closeNoteModal);
    noteModal.addEventListener('click', e => { if (e.target === noteModal) closeNoteModal(); });

    window.addEventListener('keydown', e => {
      if (e.key === 'Escape' && noteModal.classList.contains('active')) {
        closeNoteModal();
      }
    });

    $('note-form').addEventListener('submit', e => {
      e.preventDefault();
      const text = noteTextInput.value.trim();
      if (!text) return;

      const date = new Date().toISOString();
      const formattedDate = dateFormatter.format(new Date(date));

      if (currentNote) {
        currentNote.text = text;
        currentNote.lower = text.toLowerCase();
        currentNote.date = date;
        currentNote.formattedDate = formattedDate;
      } else {
        notes.unshift({
          id: String(generateId()),
          text,
          lower: text.toLowerCase(),
          date,
          formattedDate
        });
      }

      store.set(KEYS.NOTES, notes.map(n => ({ id: n.id, text: n.text, date: n.date })));
      renderNotes(searchNotesInput.value);
      closeNoteModal();
    });
  </script>
</body>
</html>
